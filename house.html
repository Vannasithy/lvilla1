<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LHB Project Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark steel sidebar + concrete-grey work surface; dense ledger tables with group bands */
:root{
  --bg:#eceeec; --panel:#ffffff; --thead:#f5f6f5; --grp:#e3e8e6; --ink:#1b2328; --muted:#5b676d; --line:#d3d9d6; --line2:#e7ebe9;
  --accent:#1f5673; --accent-ink:#ffffff; --accent-soft:#dbe8ef; --mark:#c97f00;
  --side:#1d262b; --side-ink:#e6ebe9; --side-muted:#8e9ca2; --side-on:#2b373d;
  --ok:#2f7d4f; --ok-bg:#e1f1e7; --warn:#9a5c00; --warn-bg:#fbefd9; --bad:#b3372e; --bad-bg:#f8e1df; --info:#1f5673; --info-bg:#dbe8ef;
  --input:#ffffff; --shadow:0 10px 40px rgba(15,22,26,.18);
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171a; --panel:#192125; --thead:#1e272b; --grp:#232d32; --ink:#e2e8e5; --muted:#93a1a6; --line:#2e3a3f; --line2:#253035;
  --accent:#6fb0d4; --accent-ink:#0c1418; --accent-soft:#1e3542; --mark:#f0a72d;
  --side:#0c1114; --side-ink:#e2e8e5; --side-muted:#7f8d93; --side-on:#1d272c;
  --ok:#62c48a; --ok-bg:#183326; --warn:#e8a641; --warn-bg:#352816; --bad:#ec7065; --bad-bg:#3a1d1b; --info:#6fb0d4; --info-bg:#1e3542;
  --input:#11171a; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171a; --panel:#192125; --thead:#1e272b; --grp:#232d32; --ink:#e2e8e5; --muted:#93a1a6; --line:#2e3a3f; --line2:#253035;
  --accent:#6fb0d4; --accent-ink:#0c1418; --accent-soft:#1e3542; --mark:#f0a72d;
  --side:#0c1114; --side-ink:#e2e8e5; --side-muted:#7f8d93; --side-on:#1d272c;
  --ok:#62c48a; --ok-bg:#183326; --warn:#e8a641; --warn-bg:#352816; --bad:#ec7065; --bad-bg:#3a1d1b; --info:#6fb0d4; --info-bg:#1e3542;
  --input:#11171a; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:5px;background:var(--mark);color:#1b1306;display:grid;place-items:center;font:700 13px var(--f-head);letter-spacing:.04em;flex:none}
.brand b{font:700 15px var(--f-head);letter-spacing:.02em;display:block}
.brand span{font-size:11.5px;color:var(--side-muted);display:block;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-on)}
.nav button.on{background:var(--side-on);box-shadow:inset 3px 0 0 var(--mark)}
.nav button:focus-visible{outline:2px solid var(--mark)}
.nav .no{font:500 11px var(--f-num);color:var(--side-muted);width:16px}
.me{margin-top:auto;border-top:1px solid var(--side-on);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.me b{display:block}
.me span{font-size:12px;color:var(--side-muted)}
.me button{all:unset;cursor:pointer;font-size:12.5px;color:var(--side-muted);text-decoration:underline}
.main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;flex-direction:column}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--mark)}
  .me{display:none}
  .mobile-me{display:flex!important}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.syncline{display:flex;gap:10px;align-items:center}
.syncst{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--side-muted)}
.syncst::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.syncst.pending::before,.syncst.saving::before{background:var(--mark)}
.syncst.error::before{background:var(--bad)}
.syncst.local::before{background:var(--side-muted)}
.chip .bd2{margin-left:6px;font:600 11px var(--f-num);background:var(--mark);color:#1b1306;border-radius:999px;padding:1px 7px}
.nav .bd{margin-left:auto;font:600 11px var(--f-num);background:var(--mark);color:#1b1306;border-radius:999px;padding:1px 7px}
.alert{border:1px solid var(--bad);background:var(--bad-bg);border-radius:6px;padding:10px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:3px}
.alert.warn{border-color:var(--warn);background:var(--warn-bg)}
.mobile-me{display:none;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--side-muted)}
.mobile-me button{all:unset;cursor:pointer;text-decoration:underline}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font:600 11.5px var(--f-head);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h1{font:700 27px/1.15 var(--f-head);margin:2px 0 0;text-wrap:balance}
h2{font:700 17px var(--f-head);margin:0;letter-spacing:.01em}
h3{font:700 20px var(--f-head);margin:0 0 14px}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;font-weight:600;font-size:13px;padding:7px 13px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.lnk.bad{color:var(--bad)}
.lnk:focus-visible{outline:2px solid var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi .l{font:600 11.5px var(--f-head);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font:500 22px var(--f-num);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero .v{color:var(--accent)}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{font:600 11.5px var(--f-head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--thead);white-space:nowrap}
th.num{text-align:right}
th.grpth{text-align:center;border-left:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:nowrap}
.bl{border-left:1px solid var(--line)}
tr.grp td{background:var(--grp);font-weight:700}
tr.grp td.num{font-weight:500}
tr.tot td{background:var(--thead);font-weight:700;border-top:2px solid var(--line)}
td.act{white-space:nowrap;text-align:right}
td.act .lnk{margin-left:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bar{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.barcell{display:flex;align-items:center;gap:8px;min-width:130px}
.barcell .num{min-width:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{font-family:var(--f-num);font-weight:400;margin-left:4px;opacity:.8}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input.in,select.in,textarea.in{background:var(--input);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
input.qin{background:var(--input);border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:88px;text-align:right;font-family:var(--f-num);font-size:13px}
input.qin.over{border-color:var(--bad);color:var(--bad)}
.search{max-width:260px}
.ovl{position:fixed;inset:0;background:rgba(8,12,14,.55);z-index:60;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding-block:max(5vh,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--panel);border-radius:8px;width:min(560px,100%);padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(1000px,100%)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mact{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:600;z-index:80;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ipc-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.ipc-head div{background:var(--panel);padding:9px 12px}
.ipc-head .l{font:600 11px var(--f-head);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ipc-head .v{font-weight:600}
.summ{display:grid;grid-template-columns:minmax(0,1fr) auto;max-width:520px;margin-left:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.summ div{padding:8px 12px;border-bottom:1px solid var(--line2)}
.summ .num{font-size:13.5px}
.summ .net{background:var(--accent-soft);font-weight:700;border-bottom:none}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:12.5px}
.sign b{display:block;font-size:13px}
@media (max-width:600px){.sign{grid-template-columns:1fr}}
.login{min-height:100%;display:grid;place-items:center;padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(460px,100%);padding:26px;display:flex;flex-direction:column;gap:16px}
.ulist{display:flex;flex-direction:column;gap:6px}
.ubtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.ubtn span{color:var(--muted);font-size:12.5px}
.ubtn.on{border-color:var(--accent);background:var(--accent-soft)}
.ubtn:focus-visible{outline:2px solid var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
.ledger{font-size:12.5px}
.sp{height:4px}
@media print{.kpis{break-inside:avoid}.sec{break-inside:auto}.no-print{display:none!important}.side,.acts,.toolbar,.chips,td.act,.no-print{display:none!important}.shell{display:block}.main{padding:0}.tw{border:none;overflow:visible}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="ov" class="ovl" hidden><div id="md" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ CLOUD DATABASE ============
   Paste your Google Apps Script Web App URL (ends with /exec) between the quotes.
   Leave it empty to keep data in this browser only. */
/* ONE shared file for every house. The បូរី master links here as:
     house.html?id=<Google Sheet ID>     -> one shared backend, set SHARED_API below
     house.html?api=<Apps Script /exec>  -> this house has its own backend
   Paste the single shared Apps Script /exec URL between the quotes. */
const SHARED_API='https://script.google.com/macros/s/AKfycbyMQie8X4u17x4IHKlIbjh3Tg3YN8EiTHDSU8hGXNcPYwOdRxH7E8FDJO2StIiZ3Dk7Bw/exec';
const QS=new URLSearchParams(location.search);
const SHEET_ID=(QS.get('id')||'').trim();            // which house's Google Sheet
const HOUSE=(QS.get('house')||QS.get('h')||'').trim();// house number, for the title only
const API_URL=(QS.get('api')||'').trim()||SHARED_API;
const CLOUD=!!API_URL;
if(HOUSE)document.title=HOUSE+' — LHB Project Control';

/* ============ DATA LAYER ============ */
const KEY='lhb-project-control-v1';
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,8);
const COLLS=['users','scopes','citems','sections','iitems','subs','claims','moves','prs','suppliers','reports','pos','invoices','ipcpay'];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function emptyData(){const d={settings:{project:'',client:'',contractor:'',retention:5,vat:0,clientDays:30},seq:{}};COLLS.forEach(c=>d[c]=[]);return d}
function addDays(s,k){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+(+k||0));return d.toISOString().slice(0,10)}
function daysTo(s){return Math.round((Date.parse(s+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/864e5)}
/* brings data saved by older versions up to date */
function migrate(d){
  COLLS.forEach(c=>d[c]=d[c]||[]);
  d.settings=Object.assign({project:'',client:'',contractor:'',retention:5,vat:0,clientDays:30},d.settings||{});
  d.suppliers.forEach(s=>{if(s.days==null||s.days===''){const m=String(s.credit||'').match(/\d+/);s.days=m?+m[0]:0}});
  if(!CLOUD&&d.users.length&&!d.users.some(u=>u.role==='FN'))d.users.push({id:d.users.some(u=>u.id==='u6')?uid():'u6',name:'Sokha Meas',role:'FN',pin:'1234'});
  d.pos.forEach(o=>{if(o.status==='Delivered'&&d.moves.some(m=>String(m.ref||'').startsWith('PO-'+String(o.no).padStart(3,'0'))))o.status='Received'});
  if(!CLOUD)d.prs.forEach(p=>{if(!['Being delivered','Delivered'].includes(p.status))return;
    const sp=d.suppliers.find(x=>x.id===p.supplierId)||{};
    const o={id:uid(),no:d.pos.length+1,date:p.date,prId:p.id,supplierId:p.supplierId||'',items:p.items.map(i=>({itemId:i.itemId,qty:i.qty,price:i.price})),status:p.status,creditDays:+sp.days||0,expected:'',deliveredDate:p.status==='Delivered'?p.date:'',dueDate:'',payments:[],note:p.note||'',hist:[]};
    if(o.deliveredDate)o.dueDate=addDays(o.deliveredDate,o.creditDays);d.pos.push(o);p.items.forEach(i=>i.poId=o.id);p.status='Ordered'});
  return d}
function load(){if(CLOUD)return null;try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){if(CLOUD){queueSync();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---- cloud sync: sends only the records that changed since the last load ---- */
const C={token:null,rev:0,snap:{},sending:false,timer:null,status:'saved',err:'',boot:false,bootErr:'',users:[]};
async function api(action,data){
  let r;
  try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:C.token,sheet:SHEET_ID},data||{}))})}
  catch(e){throw new Error('No connection to the cloud database')}
  let j;try{j=await r.json()}catch(e){throw new Error(SHEET_ID||!SHARED_API?'The database URL did not answer correctly. Check the web app access is “Anyone”.':'This link has no house. Open it from the បូរី master, or add ?id=<Sheet ID>.')}
  if(!j.ok){const e=new Error(j.error||'Request failed');e.auth=j.error==='AUTH';throw e}
  return j}
function takeSnap(){C.snap={};COLLS.forEach(c=>{const m={};(S[c]||[]).forEach(x=>m[x.id]=JSON.stringify(x));C.snap[c]=m});C.snap._settings=JSON.stringify(S.settings)}
function diff(){const ch={};let cnt=0;
  COLLS.forEach(c=>{const old=C.snap[c]||{},seen={},up=[];(S[c]||[]).forEach(x=>{seen[x.id]=1;if(old[x.id]!==JSON.stringify(x))up.push(x)});
    const del=Object.keys(old).filter(id=>!seen[id]);if(up.length||del.length){ch[c]={up,del};cnt+=up.length+del.length}});
  const settings=JSON.stringify(S.settings)!==C.snap._settings?S.settings:null;if(settings)cnt++;
  return{ch,settings,cnt}}
function queueSync(){clearTimeout(C.timer);C.timer=setTimeout(flush,700);setStatus('pending')}
async function flush(){
  clearTimeout(C.timer);C.timer=null;if(!C.token)return;
  if(C.sending){queueSync();return}
  const d=diff();if(!d.cnt){setStatus('saved');return}
  const sent={};Object.entries(d.ch).forEach(([c,v])=>sent[c]={up:v.up.map(x=>[x.id,JSON.stringify(x)]),del:v.del});
  const sentSettings=d.settings&&JSON.stringify(d.settings);
  C.sending=true;setStatus('saving');
  try{
    const r=await api('sync',{changes:d.ch,settings:d.settings});

function weightedProg(items,pm){const t=sum(items,camt);return t?sum(items,x=>camt(x)*(pm[x.id]||0)/100)/t:0}
const PR_OPEN=p=>['Pending','Received','Part ordered'].includes(p.status);
const PO_OPEN=o=>['Issued','Being delivered','Delivered'].includes(o.status); // not yet in stock
const PO_CAN_CANCEL=o=>['Issued','Being delivered'].includes(o.status);
const DELIV=o=>['Delivered','Received'].includes(o.status); // supplier has delivered → payable
const AWAIT=()=>S.pos.filter(o=>o.status==='Delivered');   // waiting for Stock to receive
function stockOf(itemId){let rec=0,iss=0,adj=0;S.moves.forEach(m=>{if(m.itemId!==itemId)return;if(m.type==='IN')rec+=n(m.qty);else if(m.type==='OUT')iss+=n(m.qty);else adj+=n(m.qty)});
  const pend=sum(S.prs.filter(PR_OPEN).flatMap(p=>p.items.filter(i=>i.itemId===itemId&&!i.poId)),i=>i.qty)+sum(S.pos.filter(PO_OPEN).flatMap(o=>o.items.filter(i=>i.itemId===itemId)),i=>i.qty);const it=iitem(itemId);
  return{boq:n(it&&it.qty),rec,iss,onHand:rec-iss+adj,pend,toBuy:Math.max(0,n(it&&it.qty)-rec-pend)}}
function stockStatus(s){if(s.rec+s.pend>s.boq+1e-9)return[s.rec>s.boq+1e-9?'Over BOQ':'Over-ordered','bad'];if(s.onHand<=0&&s.rec<s.boq)return['Out of stock','bad'];if(s.toBuy>0)return['To purchase','warn'];if(s.pend>0)return['On order','info'];return['Covered','ok']}
function claimRows(c,D=S){const prev=D.claims.filter(x=>x.no<c.no);const o={};D.citems.forEach(it=>{const p=sum(prev,x=>x.lines[it.id]);const cur=n(c.lines[it.id]);o[it.id]={prev:p,cur,cum:p+cur}});return o}
const claimValue=c=>sum(S.citems,it=>n(c.lines[it.id])*n(it.rate));
function claimNet(c,D=S){const R=claimRows(c,D);const cum=sum(D.citems,it=>R[it.id].cum*it.rate),prev=sum(D.citems,it=>R[it.id].prev*it.rate),cur=cum-prev,rp=n(D.settings.retention)/100,ret=cur*rp;return{cum,prev,cur,rp,ret,net:cur-ret}}
const poNo=o=>'PO-'+String(o.no).padStart(3,'0');
const invNo=i=>'INV-'+String(i.no).padStart(3,'0');
const po=id=>S.pos.find(x=>x.id===id);
const poTotal=o=>sum(o.items,lineAmt);
const paidOf=x=>sum(x.payments||[],p=>p.amount);
const termLabel=d=>n(d)?n(d)+' days credit':'Cash on delivery';
const pl=k=>Math.abs(k)===1?'':'s';
function dueTag(d){if(d<0)return[`Overdue ${-d} day${pl(d)}`,'bad'];if(d===0)return['Due today','bad'];if(d<=7)return[`Due in ${d} day${pl(d)}`,'warn'];return[`Due in ${d} days`,'info']}
function poPay(o){const amt=poTotal(o),paid=paidOf(o),bal=r2(amt-paid);let days=null,tag;
  if(o.status==='Cancelled')tag=['Cancelled',''];else if(bal<=0.004)tag=['Paid','ok'];
  else if(!DELIV(o)||!o.dueDate)tag=[paid>0?'Deposit paid':'Pay after delivery',''];
  else{days=daysTo(o.dueDate);tag=dueTag(days);if(paid>0)tag=[tag[0]+' · part paid',tag[1]]}
  return{amt,paid,bal,days,tag}}
const invTotal=i=>r2(n(i.amount)*(1+n(i.vat)/100));
function invPay(i){const amt=invTotal(i),paid=paidOf(i),bal=r2(amt-paid),days=daysTo(i.dueDate);let tag=bal<=0.004?['Paid','ok']:dueTag(days);if(bal>0.004&&paid>0)tag=[tag[0]+' · part paid',tag[1]];return{amt,paid,bal,days,tag}}
const invOfClaim=id=>S.invoices.find(i=>i.claimId===id);
const readyClaims=()=>S.claims.filter(c=>c.status==='Approved'&&!invOfClaim(c.id)).sort((a,b)=>a.no-b.no);
function alerts(){const a={};
  if(['PM','ST'].includes(me.role))a.stock=AWAIT().length;
  if(['PM','PC'].includes(me.role))a.proc=S.prs.filter(p=>p.status==='Pending').length;
  if(PAY()){a.ap=S.pos.filter(o=>{const p=poPay(o);return DELIV(o)&&p.bal>0.004&&p.days<=7}).length+sum(S.subs,s=>(s.reqs||[]).filter(r=>r.status==='Requested').length)+ipcToPay().length;
    a.inv=readyClaims().length;a.ar=S.invoices.filter(i=>{const p=invPay(i);return p.bal>0.004&&p.days<0}).length}
  return a}

let toastT;function toast(msg,cls=''){const t=$('#toast');t.textContent=msg;t.className='toast '+cls;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function modal(html,wide=false){const md=$('#md');md.className='modal'+(wide?' wide':'');md.innerHTML=html;$('#ov').hidden=false;const f=md.querySelector('input,select,textarea');if(f)f.focus()}
function closeModal(){$('#ov').hidden=true;$('#md').innerHTML=''}
let pendingYes=null;
function confirmBox(msg,fn,label='Delete'){pendingYes=fn;modal(`<h3>Please confirm</h3><p>${msg}</p><div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="confirmYes">${label}</button></div>`)}
function field(f){const v=f.v??'';const id='f_'+f.k;let inp;
  if(f.t==='select')inp=`<select class="in" id="${id}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea class="in" id="${id}" rows="3">${esc(v)}</textarea>`;
  else inp=`<input class="in" id="${id}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} value="${esc(v)}" ${f.req?'required':''}>`;
  return `<label class="f ${f.full?'full':''}" for="${id}">${esc(f.l)}${inp}</label>`}
function form(title,fields,onSave,saveLabel='Save'){
  modal(`<h3>${esc(title)}</h3><form id="mf" class="fgrid">${fields.map(field).join('')}<div class="mact"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">${saveLabel}</button></div></form>`);
  $('#mf').onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>{const el=$('#f_'+f.k);v[f.k]=f.t==='number'?n(el.value):el.value.trim()});const err=onSave(v);if(err){toast(err,'bad');return}closeModal();save();render()}}

const V={};

/* ---------- DASHBOARD ---------- */
V.dash=()=>{
  const pm=progressMap();const ct=sum(S.citems,camt);const ov=weightedProg(S.citems,pm);
  const claimed=sum(S.claims,claimValue);
  const subWait=sum(S.subs,s=>sum(s.reqs.filter(r=>r.status==='Requested'),r=>r.amount));
  const openPR=S.prs.filter(PR_OPEN).length+S.pos.filter(PO_OPEN).length;
  const toBuy=S.iitems.filter(i=>i.stock&&stockOf(i.id).toBuy>0).length;
  const last=[...S.reports].sort((a,b)=>a.date<b.date?1:-1)[0];
  const k=(l,v,s,c='')=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  let tiles=k('Overall progress',fp(ov),'Weighted by Contract BOQ value','hero');
  if(M())tiles+=k('Contract value',fm(ct),`${S.citems.length} items in ${S.scopes.length} scopes`)+k('Claimed to date',fm(claimed),`${fp(ct?claimed/ct:0)} of contract · ${S.claims.length} claims`)+k('Sub-contract requests',fm(subWait),'Waiting for payment');
  tiles+=k('Open requests & orders',openPR,'Not yet delivered to stock')+k('Items to purchase',toBuy,'Stock below Internal BOQ');
  if(PAY())tiles+=k('Receivable (AR)',fm(sum(S.invoices,i=>invPay(i).bal)),'Invoices not yet paid by client')+k('Payable to suppliers',fm(sum(S.pos.filter(DELIV),o=>poPay(o).bal)),'Delivered POs not yet paid');
  const rows=S.scopes.map(sc=>{const its=S.citems.filter(x=>x.scopeId===sc.id);const b=sum(its,camt);
    const ib=sum(S.iitems.filter(i=>{const s=section(i.sectionId);return s&&s.scopeId===sc.id}),iamt);
    const cl=sum(S.claims,c=>sum(its,it=>n(c.lines[it.id])*it.rate));
    return `<tr><td><b>${esc(sc.name)}</b></td>${M()?`<td class="num">${fm(b)}</td><td class="num">${ib?fm(ib):'<span class="muted">—</span>'}</td>`:''}<td>${bar(weightedProg(its,pm))}</td>${M()?`<td>${bar(b?cl/b:0)}</td>`:''}</tr>`}).join('');
  return ph(esc(S.settings.contractor)+' · '+esc(S.settings.client),'Dashboard')+(PAY()?apAlert():'')+`<div class="kpis">${tiles}</div>
  <div class="sec"><div class="sechead"><h2>Progress by scope</h2></div><div class="tw"><table><thead><tr><th>Scope</th>${M()?'<th class="num">Contract budget</th><th class="num">Internal budget</th>':''}<th>Site progress</th>${M()?'<th>Claimed</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="sec"><div class="sechead"><h2>Latest site report</h2></div>${last?`<div class="card"><div class="top"><b>${fd(last.date)} · ${esc(last.by)}</b><span class="pill">${esc(last.weather)} · ${last.manpower} workers</span></div><div>${esc(last.notes)}</div><div class="small muted">${Object.keys(last.progress).length} BOQ items updated</div></div>`:'<div class="empty">No site reports yet.</div>'}</div>`;
};

/* ---------- 1. CONTRACT BOQ ---------- */

  const E=ed('contract'),pm=progressMap(),m=M();let rows='',gt=0;
  S.scopes.forEach((sc,i)=>{const its=S.citems.filter(x=>x.scopeId===sc.id);const st=sum(its,camt);gt+=st;
    rows+=`<tr class="grp"><td class="code">${i+1}</td><td colspan="${m?4:3}">${esc(sc.name)}</td>${m?`<td class="num">${fm(st)}</td>`:''}<td>${bar(weightedProg(its,pm))}</td><td class="act">${E?`<button class="lnk" data-act="addCItem" data-id="${sc.id}">+ Item</button><button class="lnk" data-act="editScope" data-id="${sc.id}">Rename</button><button class="lnk bad" data-act="delScope" data-id="${sc.id}">Delete</button>`:''}</td></tr>`;
    its.forEach(it=>rows+=`<tr><td class="code">${cCode(it)}</td><td>${esc(it.desc)}</td><td>${esc(it.unit)}</td><td class="num">${fq(it.qty)}</td>${m?`<td class="num">${fm(it.rate)}</td><td class="num">${fm(camt(it))}</td>`:''}<td>${bar((pm[it.id]||0)/100)}</td><td class="act">${E?`<button class="lnk" data-act="editCItem" data-id="${it.id}">Edit</button><button class="lnk bad" data-act="delCItem" data-id="${it.id}">Delete</button>`:''}</td></tr>`);

};

/* ---------- 2. INTERNAL BOQ ---------- */
V.internal=()=>{
  const E=ed('internal'),m=M();if(!scope(ui.iScope))ui.iScope=S.scopes[0]&&S.scopes[0].id;const sc=scope(ui.iScope);
  const chips=`<div class="chips">${S.scopes.map(s=>{const c=S.sections.filter(x=>x.scopeId===s.id).length;return `<button class="chip ${s.id===ui.iScope?'on':''}" data-act="iScope" data-id="${s.id}">${esc(s.name)}<span class="c">${c}</span></button>`}).join('')}</div>`;

  const secs=S.sections.filter(x=>x.scopeId===sc.id);const cb=sum(S.citems.filter(x=>x.scopeId===sc.id),camt);let it=0,rows='';const wq=S.iitems.some(x=>n(x.cpu)>0&&secs.some(s=>s.id===x.sectionId));

    its.forEach(x=>rows+=`<tr><td class="code">${iCode(x)}</td><td>${esc(x.name)}${x.code?`<div class="small muted code">${esc(x.code)}</div>`:''}</td><td>${esc(x.unit)}</td><td class="num">${fq(x.qty)}</td>${wq?`<td class="num">${n(x.cpu)?`${fq(r2(n(x.qty)*n(x.cpu)))} ${esc(x.cu)}<div class="small muted">${fq(x.cpu)} ${esc(x.cu)}/${esc(x.unit)}</div>`:'<span class="muted">—</span>'}</td>`:''}${m?`<td class="num">${fm(x.rate)}${n(x.cpu)?'/'+esc(x.cu):''}</td><td class="num">${fm(iamt(x))}</td>`:''}<td>${x.stock?'<span class="pill info">Stock</span>':'<span class="pill">Not stocked</span>'}</td><td class="act">${E?`<button class="lnk" data-act="editIItem" data-id="${x.id}">Edit</button><button class="lnk bad" data-act="delIItem" data-id="${x.id}">Delete</button>`:''}</td></tr>`);
    if(!its.length)rows+=`<tr><td></td><td colspan="${(m?7:5)+(wq?1:0)}" class="muted small">No items in this section yet.</td></tr>`;
  });
  if(m&&secs.length)rows+=`<tr class="tot"><td></td><td colspan="${4+(wq?1:0)}">Internal total — ${esc(sc.name)}</td><td class="num">${fm(it)}</td><td colspan="2"></td></tr>`;

};

/* ---------- 3. SUB-CONTRACTS ---------- */
V.sub=()=>{
  const E=ed('sub'),RQ=E||me.role==='SE';let rows='';
  if(ui.subTab==='ipc')return ph('Section 3 · Labour contracts per scope','Sub-contracts')+subTabs()+vIpc();
  const T={c:0,q:0,p:0};
  S.subs.forEach(s=>{const f=subFig(s);T.c+=f.c;T.q+=f.q;T.p+=f.p;const open=ui.subOpen===s.id,sc=scope(s.scopeId);
    rows+=`<tr><td><b>${esc(sc?sc.name:'—')}</b></td><td>${esc(s.name)}${s.ipcSheetId?` <span class="pill info" title="Figures come from the IPC system">IPC</span>${f.n!=null?`<div class="small muted">${f.n} house${pl(f.n)}${f.wait?` · ${f.wait} claim${pl(f.wait)} waiting approval`:''}</div>`:''}`:''}</td><td class="small">${esc(s.phone)}</td><td class="num">${fm(f.c)}</td><td class="num" style="color:var(--warn)">${fm(f.q)}</td><td class="num">${fm(f.p)}</td><td class="num"><b>${fm(f.c-f.p)}</b></td><td>${bar(f.c?f.p/f.c:0)}</td><td class="act">${s.ipcSheetId&&s.ipcAppUrl?`<a class="lnk" href="${esc(s.ipcAppUrl)}" target="_blank" rel="noopener" title="Open the IPC system in a new tab">Claims ↗</a>`:`<button class="lnk" data-act="toggleSub" data-id="${s.id}">${open?'Hide':(s.ipcSheetId?'Claims':'Requests')}</button>`}${E?`<button class="lnk" data-act="editSub" data-id="${s.id}">Edit</button><button class="lnk bad" data-act="delSub" data-id="${s.id}">Delete</button>`:''}</td></tr>`;
    if(open)rows+=`<tr><td colspan="9" style="background:var(--thead);padding:12px">${s.ipcSheetId?subIpcDetail(s):subReqDetail(s,RQ)}</td></tr>`});
  if(S.subs.length)rows+=`<tr class="tot"><td colspan="3">Total</td><td class="num">${fm(T.c)}</td><td class="num">${fm(T.q)}</td><td class="num">${fm(T.p)}</td><td class="num">${fm(T.c-T.p)}</td><td>${bar(T.c?T.p/T.c:0)}</td><td></td></tr>`;
  return ph('Section 3 · Labour contracts per scope','Sub-contracts',E?'<button class="btn pri" data-act="addSub">+ Sub-contract</button>':'')+subTabs()+
   (S.subs.length?`<div class="tw"><table><thead><tr><th>Scope</th><th>Sub-contractor</th><th>Phone</th><th class="num">Total contract</th><th class="num">Requesting</th><th class="num">Paid</th><th class="num">Remaining</th><th>Paid %</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No sub-contracts yet.</div>');
};
function ipcSubClaims(s){if(!ipcLinked())return null;const cs=IPC.data.contracts.filter(c=>ipcMatch(s,c));const ids={};cs.forEach(c=>ids[c.id]=1);return{contracts:cs,claims:IPC.data.claims.filter(c=>ids[c.contractId])}}
function subFig(s){
  if(s.ipcSheetId){const L=ipcSubClaims(s);if(L){const pm=ipcPaidMap(),appr=L.claims.filter(c=>c.status==='approved'),sub=L.claims.filter(c=>c.status==='submitted');const paid=sum(appr,c=>Math.min(n(pm[c.id]),n(c.received)));
    return{c:sum(L.contracts,c=>c.contractValue)||n(s.amount),q:r2(sum(appr,c=>c.received)-paid+sum(sub,c=>c.received)),p:paid,n:L.contracts.length,wait:sub.length}}return{c:n(s.amount),q:0,p:0}}
  return{c:n(s.amount),q:sum(s.reqs.filter(r=>r.status==='Requested'),r=>r.amount),p:sum(s.reqs.filter(r=>r.status==='Paid'),r=>r.amount)}}

      rows+=`<tr><td class="code">${cCode(it)}</td><td>${esc(it.desc)}</td><td>${esc(it.unit)}</td><td class="num">${fq(it.qty)}</td>${m?`<td class="num">${fm(it.rate)}</td><td class="num">${fm(camt(it))}</td>`:''}<td class="num bl">${fq(r.prev)}</td>${m?`<td class="num">${fm(r.prev*it.rate)}</td>`:''}<td class="num bl">${cur}</td>${m?`<td class="num" id="ua_${it.id}">${fm(r.cur*it.rate)}</td>`:''}<td class="num bl" id="cu_${it.id}">${fq(r.cum)}</td>${m?`<td class="num" id="cua_${it.id}">${fm(r.cum*it.rate)}</td>`:''}<td class="num" id="cp_${it.id}" style="${over?'color:var(--bad)':''}">${fp(n(it.qty)?r.cum/it.qty:0)}</td><td class="num bl muted">${fq(pm[it.id]||0)}%</td></tr>`});
  });
  if(m)rows+=`<tr class="tot"><td></td><td colspan="4">Total</td><td class="num">${fm(T.ca)}</td><td class="bl"></td><td class="num">${fm(T.pa)}</td><td class="bl"></td><td class="num" id="t_ua">${fm(T.ua)}</td><td class="bl"></td><td class="num" id="t_cua">${fm(T.cua)}</td><td class="num" id="t_p">${fp(T.ca?T.cua/T.ca:0)}</td><td class="bl"></td></tr>`;
  const head=m?`<tr><th colspan="3"></th><th colspan="3" class="grpth">Contract</th><th colspan="2" class="grpth">Previous</th><th colspan="2" class="grpth">This claim</th><th colspan="3" class="grpth">Cumulative</th><th class="grpth">Site</th></tr><tr><th>No.</th><th>Description</th><th>Unit</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th class="num bl">Qty</th><th class="num">Amount</th><th class="num bl">Qty</th><th class="num">Amount</th><th class="num bl">Qty</th><th class="num">Amount</th><th class="num">%</th><th class="num bl">%</th></tr>`
    :`<tr><th colspan="3"></th><th class="grpth">Contract</th><th class="grpth">Previous</th><th class="grpth">This claim</th><th colspan="2" class="grpth">Cumulative</th><th class="grpth">Site</th></tr><tr><th>No.</th><th>Description</th><th>Unit</th><th class="num">Qty</th><th class="num bl">Qty</th><th class="num bl">Qty</th><th class="num bl">Qty</th><th class="num">%</th><th class="num bl">%</th></tr>`;
  const next={Draft:'Submitted',Submitted:'Approved'}[c.status];const inv=invOfClaim(c.id);
  const cacts=E?`${edit?'<button class="btn" data-act="fillClaim">Fill from site progress</button>':''}${next?`<button class="btn" data-act="claimStatus" data-s="${next}">Mark ${next.toLowerCase()}</button>`:''}${c.status!=='Draft'&&!inv&&c.id===cs[cs.length-1].id?'<button class="btn" data-act="claimStatus" data-s="Draft">Reopen as draft</button>':''}${!inv&&c.id===cs[cs.length-1].id?'<button class="btn danger" data-act="delClaim">Delete</button>':''}`:'';
  return ph('Section 4 · IPC breakdown against Contract BOQ','Progress Claim',acts)+`<div class="toolbar">${chips}</div>
  <div class="ipc-head"><div><div class="l">Project</div><div class="v">${esc(S.settings.project)}</div></div><div><div class="l">Claim no.</div><div class="v">${ipcNo(c)}</div></div><div><div class="l">Valuation date</div><div class="v">${fd(c.date)}</div></div><div><div class="l">Status</div><div class="v"><span class="pill ${pill}">${c.status}</span></div></div>${m?`<div><div class="l">Invoice</div><div class="v">${inv?`${invNo(inv)} <span class="pill ${invPay(inv).tag[1]}">${invPay(inv).tag[0]}</span>`:'<span class="muted">Not invoiced</span>'}</div></div>`:''}</div>
  <div class="toolbar" style="justify-content:space-between"><span class="small muted">${edit?'Type the quantity done this period in “This claim”. Previous = sum of earlier claims.':'This claim is locked. Reopen the latest claim as a draft to change it.'}</span><div class="acts">${cacts}</div></div>
  <div class="tw"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>

};
function claimSummary(c){const{cum,prev,cur,rp,ret}=claimNet(c);
  const row=(l,v,cls='')=>`<div class="${cls}">${l}</div><div class="num ${cls}">${v}</div>`;
  return `<div class="summ">${row('A. Cumulative work done to date',fm(cum))}${row('B. Less previous claims',fm(-prev))}${row('C. Work done this period (A − B)',fm(cur))}${row(`D. Less retention ${n(S.settings.retention)}% of C`,fm(-ret))}${row('E. Cumulative retention held',fm(cum*rp))}${row('Net amount due this claim (C − D)',fm(cur-ret),'net')}</div>`}
function updClaimRow(id){const c=S.claims.find(x=>x.id===ui.claimId);const it=citem(id);const R=claimRows(c);const r=R[id];const m=M();const over=r.cum>n(it.qty)+1e-9;

  set('cu_'+id,fq(r.cum));const cp=document.getElementById('cp_'+id);if(cp){cp.textContent=fp(n(it.qty)?r.cum/it.qty:0);cp.style.color=over?'var(--bad)':''}
  const inp=document.getElementById('cq_'+id);if(inp)inp.classList.toggle('over',over);
  if(!m)return;set('ua_'+id,fm(r.cur*it.rate));set('cua_'+id,fm(r.cum*it.rate));
  const its=S.citems.filter(x=>x.scopeId===it.scopeId);const ca=sum(its,camt),cua=sum(its,x=>R[x.id].cum*x.rate);
  set('sg_ua_'+it.scopeId,fm(sum(its,x=>R[x.id].cur*x.rate)));set('sg_cua_'+it.scopeId,fm(cua));set('sg_p_'+it.scopeId,fp(ca?cua/ca:0));
  const TA=sum(S.citems,camt),TC=sum(S.citems,x=>R[x.id].cum*x.rate);set('t_ua',fm(sum(S.citems,x=>R[x.id].cur*x.rate)));set('t_cua',fm(TC));set('t_p',fp(TA?TC/TA:0));
  const sm=$('#summ');if(sm)sm.innerHTML=claimSummary(c)}

/* ---------- 6. PROCUREMENT ---------- */
const PR_LABEL={Pending:'New request',Received:'Accepted','Part ordered':'Part ordered',Ordered:'PO issued',Cancelled:'Cancelled'};

function prDelivery(p){const os=prPOs(p);if(!os.length)return '<span class="muted small">—</span>';return os.map(o=>`<div class="small"><b class="code">${poNo(o)}</b> <span class="pill ${PO_CL[o.status]}">${PO_LABEL[o.status]}</span></div>`).join('')}

function prTable(list,proc){const m=M(),E=proc&&ed('proc');

  if(ui.procTab==='sup'){
    const rows=S.suppliers.map(s=>{const os=S.pos.filter(o=>o.supplierId===s.id);const bal=sum(os.filter(o=>o.status!=='Cancelled'),o=>poPay(o).bal);
      return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact)}</td><td>${esc(s.phone)}</td><td>${termLabel(s.days)}</td><td class="small">${esc(s.category)}</td><td class="num">${os.filter(PO_OPEN).length}</td>${m?`<td class="num">${bal>0.004?fm(bal):'<span class="muted">—</span>'}</td>`:''}<td class="act">${E?`<button class="lnk" data-act="editSupplier" data-id="${s.id}">Edit</button><button class="lnk bad" data-act="delSupplier" data-id="${s.id}">Delete</button>`:''}</td></tr>`}).join('');
    return head+(S.suppliers.length?`<div class="tw"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Credit term</th><th>Supplies</th><th class="num">Open POs</th>${m?'<th class="num">Unpaid</th>':''}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No suppliers yet.</div>');
  }
  if(ui.procTab==='po'){
    const pred=(o,k)=>k==='all'||(k==='open'?PO_OPEN(o):o.status===k);
    const F=[['open','Open'],['Issued','Issued'],['Being delivered','Being delivered'],['Delivered','Awaiting stock'],['Received','Received'],['Cancelled','Cancelled'],['all','All']];
    return head+`<div class="toolbar">${fchips(F,S.pos,'poF',pred)}</div><p class="small muted" style="margin:0 0 10px">Every PO is visible to Finance. Delivered POs become supplier payments in Payables, due by the supplier's credit term.</p>`+poTable([...S.pos].sort((a,b)=>b.no-a.no).filter(o=>pred(o,ui.poF)));
  }
  const pred=(p,k)=>k==='all'||(k==='open'?PR_OPEN(p):p.status===k);
  const F=[['open','To process'],['Pending','New'],['Received','Accepted'],['Part ordered','Part ordered'],['Ordered','PO issued'],['Cancelled','Cancelled'],['all','All']];
  return head+`<div class="toolbar">${fchips(F,S.prs,'procF',pred)}</div>`+prTable([...S.prs].sort((a,b)=>b.no-a.no).filter(p=>pred(p,ui.procF)),true);
};

/* ---------- PURCHASE REQUEST MODAL (Stock + Site) ---------- */
let prCtx=null;
function prModal(source,prefill={}){
  const scs=S.scopes.filter(s=>S.iitems.some(i=>i.stock&&iScopeId(i)===s.id));
  const first=Object.keys(prefill)[0];
  prCtx={source,tmp:{...prefill},sc:first?iScopeId(iitem(first)):(scs[0]&&scs[0].id)};
  modal(`<h3>New purchase request</h3><form id="prmf" class="fgrid">${field({k:'needBy',l:'Needed on site by',t:'date',v:''})}${field({k:'by',l:'Requested by',v:me.name})}${field({k:'note',l:'Purpose / note',t:'textarea',full:true})}
   <div class="full" id="prbody"></div><div class="mact"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Send to procurement</button></div></form>`,true);
  prBody();
  $('#prmf').onsubmit=e=>{e.preventDefault();const items=Object.entries(prCtx.tmp).filter(([,q])=>n(q)>0).map(([itemId,qty])=>({itemId,qty:n(qty),price:n(iitem(itemId).rate),cpu:n(iitem(itemId).cpu),cu:iitem(itemId).cu||''}));
    if(!items.length){toast('Enter a quantity for at least one item','bad');return}
    const over=items.map(i=>({i,it:iitem(i.itemId),s:stockOf(i.itemId)})).filter(x=>x.i.qty>x.s.toBuy+1e-9);
    if(over.length){toast('More than the Internal BOQ allows — '+over.map(x=>`${x.it.name}: only ${fq(x.s.toBuy)} ${x.it.unit} left to order`).join(' · '),'bad');return}
    const p={id:uid(),no:Math.max(0,...S.prs.map(x=>n(x.no)))+1,date:today(),needBy:$('#f_needBy').value,source:prCtx.source,by:$('#f_by').value.trim()||me.name,items,status:'Pending',supplierId:'',note:$('#f_note').value.trim(),hist:[]};
    S.prs.push(p);if(prCtx.source==='Stock'){ui.sel.clear();ui.stTab='req'}save();closeModal();render();toast(prNo(p)+' sent to procurement')}}
function prBody(){
  const scs=S.scopes.filter(s=>S.iitems.some(i=>i.stock&&iScopeId(i)===s.id));const cnt=Object.values(prCtx.tmp).filter(q=>n(q)>0).length;
  const its=S.iitems.filter(i=>i.stock&&iScopeId(i)===prCtx.sc);
  $('#prbody').innerHTML=`<div class="sechead" style="margin-bottom:8px"><div class="chips">${scs.map(s=>`<button type="button" class="chip ${s.id===prCtx.sc?'on':''}" data-act="prScope" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div><span class="pill info" id="prcnt">${cnt} item${cnt===1?'':'s'} in request</span></div>
  <div class="tw" style="max-height:44vh;overflow:auto"><table><thead><tr><th>No.</th><th>Internal BOQ item</th><th>Unit</th><th class="num">BOQ qty</th><th class="num">On hand</th><th class="num">Left to order</th><th class="num">Request qty</th></tr></thead><tbody>${its.map(i=>{const s=stockOf(i.id);return `<tr><td class="code">${iCode(i)}</td><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td class="num">${fq(s.boq)}</td><td class="num">${fq(s.onHand)}</td><td class="num">${fq(s.toBuy)}</td><td class="num"><input class="qin ${n(prCtx.tmp[i.id])>s.toBuy+1e-9?'over':''}" data-pq="${i.id}" type="number" min="0" step="any" value="${prCtx.tmp[i.id]||''}" placeholder="0" aria-label="Request qty ${esc(i.name)}"></td></tr>`}).join('')}</tbody></table></div>`}

function prDetail(id){
  const p=S.prs.find(x=>x.id===id),E=ed('proc'),m=M();
  const rows=p.items.map(i=>{const it=iitem(i.itemId),o=i.poId&&po(i.poId);return `<tr><td class="code">${it?iCode(it):''}</td><td>${esc(it?it.name:'(deleted)')}</td><td>${esc(it?it.unit:'')}</td><td class="num">${fq(i.qty)}</td>${m?`<td class="num">${fm(i.price)}${n(i.cpu)?'/'+esc(i.cu):''}</td><td class="num">${fm(lineAmt(i))}</td>`:''}<td>${o?`<b class="code">${poNo(o)}</b> <span class="pill ${PO_CL[o.status]}">${PO_LABEL[o.status]}</span>`:'<span class="muted small">Not ordered yet</span>'}</td></tr>`}).join('');
  modal(`<h3>${prNo(p)} <span class="pill ${PR_CL[p.status]||''}" style="vertical-align:middle">${PR_LABEL[p.status]||esc(p.status)}</span></h3>
  <div class="ipc-head"><div><div class="l">Requested</div><div class="v">${fd(p.date)}</div></div><div><div class="l">Need by</div><div class="v">${fd(p.needBy)}</div></div><div><div class="l">From</div><div class="v">${p.source} · ${esc(p.by)}</div></div></div>
  ${p.note?`<p class="small">${esc(p.note)}</p>`:''}
  <div class="tw"><table><thead><tr><th>No.</th><th>Item</th><th>Unit</th><th class="num">Qty</th>${m?'<th class="num">Est. price</th><th class="num">Amount</th>':''}<th>Purchase order</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="mact">${E&&['Pending','Received'].includes(p.status)?`<button class="btn danger" data-act="prCancel" data-id="${p.id}">Cancel request</button>`:''}<button class="btn" data-act="close">Close</button>${E&&p.status==='Pending'?`<button class="btn" data-act="prAccept" data-id="${p.id}">Accept request</button>`:''}${E&&['Received','Part ordered'].includes(p.status)?`<button class="btn pri" data-act="poNew" data-id="${p.id}">Create purchase order</button>`:''}</div>`,true)}

function poNewModal(prId){
  const p=S.prs.find(x=>x.id===prId);const open=p.items.map((i,k)=>({i,k})).filter(x=>!x.i.poId);
  if(!S.suppliers.length){toast('Add a supplier first (Procurement → Suppliers)','bad');return}
  const price=i=>n(i.price)||n(iitem(i.itemId)?.rate);
  const rows=open.map(({i,k})=>{const it=iitem(i.itemId);return `<tr><td><input type="checkbox" id="pk_${k}" checked aria-label="Include ${esc(it?it.name:'item')}"></td><td>${esc(it?it.name:'?')}</td><td>${esc(it?it.unit:'')}</td><td class="num"><input class="qin" id="pq_${k}" type="number" step="any" min="0" value="${i.qty}" aria-label="Qty"></td><td class="num"><input class="qin" id="pu_${k}" type="number" step="any" min="0" value="${price(i)}" aria-label="Unit price">${n(i.cpu)?`<div class="small muted">per ${esc(i.cu)} · ${fq(i.cpu)} ${esc(i.cu)}/pcs</div>`:''}</td><td class="num" id="pa_${k}"></td></tr>`}).join('');
  const def=S.suppliers.find(s=>s.id===p.supplierId)||S.suppliers[0];
  modal(`<h3>Purchase order from ${prNo(p)}</h3><form id="pof" class="fgrid">${field({k:'sup',l:'Supplier',t:'select',o:S.suppliers.map(s=>[s.id,s.name+' · '+termLabel(s.days)]),v:def.id,full:true})}${field({k:'date',l:'PO date',t:'date',v:today()})}${field({k:'expected',l:'Expected delivery',t:'date',v:p.needBy||''})}
   <div class="full tw"><table><thead><tr><th></th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead><tbody>${rows}<tr class="tot"><td colspan="5">PO total</td><td class="num" id="potot"></td></tr></tbody></table></div>
   ${field({k:'note',l:'Note to supplier / Finance',t:'textarea',full:true})}
   <p class="hint full">Untick items to order them from another supplier later. Finance sees this PO straight away; payment falls due by the supplier's credit term after delivery.</p>
   <div class="mact"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Issue purchase order</button></div></form>`,true);
  const calc=()=>{let t=0;open.forEach(({k})=>{const a=n($('#pq_'+k).value)*(n(open.find(x=>x.k===k).i.cpu)||1)*n($('#pu_'+k).value);$('#pa_'+k).textContent=fm(a);if($('#pk_'+k).checked)t+=a});$('#potot').textContent=fm(t)};
  $('#pof').addEventListener('input',calc);$('#pof').addEventListener('change',calc);calc();
  $('#pof').onsubmit=e=>{e.preventDefault();const sel=open.filter(({k})=>$('#pk_'+k).checked&&n($('#pq_'+k).value)>0);if(!sel.length){toast('Tick at least one item with a quantity','bad');return}
    if(sel.some(({i,k})=>n($('#pq_'+k).value)>n(i.qty)+1e-9)){toast('PO quantity cannot be more than the requested quantity','bad');return}
    const sp=supplier($('#f_sup').value);
    const o={id:uid(),no:Math.max(0,...S.pos.map(x=>n(x.no)))+1,date:$('#f_date').value||today(),prId:p.id,supplierId:sp.id,items:sel.map(({i,k})=>({itemId:i.itemId,qty:n($('#pq_'+k).value),price:n($('#pu_'+k).value),cpu:n(i.cpu),cu:i.cu||''})),status:'Issued',creditDays:n(sp.days),expected:$('#f_expected').value,deliveredDate:'',dueDate:'',payments:[],note:$('#f_note').value.trim(),hist:[{s:'Issued',date:today(),by:me.name}]};
    S.pos.push(o);sel.forEach(({i})=>i.poId=o.id);
    p.status=p.items.every(i=>i.poId)?'Ordered':'Part ordered';(p.hist=p.hist||[]).push({s:p.status,date:today(),by:me.name});
    save();closeModal();ui.procTab='po';ui.poF='open';render();toast(poNo(o)+' issued and sent to Finance')}}

function poDetail(id){
  const o=po(id),E=ed('proc'),m=M(),pp=poPay(o),sp=supplier(o.supplierId),pr=S.prs.find(x=>x.id===o.prId);
  const rows=o.items.map(i=>{const it=iitem(i.itemId);return `<tr><td class="code">${it?iCode(it):''}</td><td>${esc(it?it.name:'(deleted)')}</td><td>${esc(it?it.unit:'')}</td><td class="num">${fq(i.qty)}${i.recQty!=null&&n(i.recQty)!==n(i.qty)?`<div class="small" style="color:var(--warn)">received ${fq(i.recQty)}</div>`:''}</td>${m?`<td class="num">${fm(i.price)}${n(i.cpu)?'/'+esc(i.cu):''}</td><td class="num">${fm(lineAmt(i))}</td>`:''}</tr>`}).join('');
  const pays=(o.payments||[]).map(y=>`<tr><td>${fd(y.date)}</td><td class="small">${esc(y.ref)}</td><td class="num">${fm(y.amount)}</td></tr>`).join('');
  modal(`<h3>${poNo(o)} <span class="pill ${PO_CL[o.status]}" style="vertical-align:middle">${PO_LABEL[o.status]}</span></h3>
  <div class="ipc-head"><div><div class="l">Supplier</div><div class="v">${esc(sp?sp.name:'—')}</div><div class="small muted">${esc(sp?sp.phone:'')}</div></div><div><div class="l">PO date</div><div class="v">${fd(o.date)}</div></div><div><div class="l">From request</div><div class="v">${pr?prNo(pr)+' · '+pr.source:'—'}</div></div><div><div class="l">Credit term</div><div class="v">${termLabel(o.creditDays)}</div></div><div><div class="l">${o.deliveredDate?'Delivered':'Expected delivery'}</div><div class="v">${fd(o.deliveredDate||o.expected)}</div></div>${o.receivedDate?`<div><div class="l">Received in stock</div><div class="v">${fd(o.receivedDate)}</div><div class="small muted">${esc(o.receivedBy||'')}</div></div>`:''}${m?`<div><div class="l">Payment due</div><div class="v">${o.dueDate?fd(o.dueDate):'After delivery'}</div></div>`:''}</div>
  ${o.note?`<p class="small">${esc(o.note)}</p>`:''}
  <div class="tw"><table><thead><tr><th>No.</th><th>Item</th><th>Unit</th><th class="num">Qty</th>${m?'<th class="num">Unit price</th><th class="num">Amount</th>':''}</tr></thead><tbody>${rows}${m?`<tr class="tot"><td colspan="5">Total</td><td class="num">${fm(pp.amt)}</td></tr>`:''}</tbody></table></div>
  ${m?`<div class="sec"><div class="sechead"><h2>Payments</h2><span class="pill ${pp.tag[1]}">${pp.tag[0]}</span></div>${pays?`<div class="tw"><table><thead><tr><th>Date</th><th>Reference</th><th class="num">Amount</th></tr></thead><tbody>${pays}<tr class="tot"><td colspan="2">Balance to pay</td><td class="num">${fm(pp.bal)}</td></tr></tbody></table></div>`:`<p class="small muted" style="margin:0">No payments yet. Balance ${fm(pp.bal)}.</p>`}</div>`:''}
  <div class="mact">${E&&PO_CAN_CANCEL(o)?`<button class="btn danger" data-act="poCancel" data-id="${o.id}">Cancel PO</button>`:''}<button class="btn" data-act="close">Close</button>${PAY()&&o.status!=='Cancelled'&&pp.bal>0.004?`<button class="btn" data-act="poPayNew" data-id="${o.id}">Record payment</button>`:''}${E&&PO_NEXT[o.status]?`<button class="btn pri" data-act="poAdvance" data-id="${o.id}">${PO_BTN[o.status]}</button>`:''}</div>`,true)}

function poAdvance(o){const nx=PO_NEXT[o.status];if(!nx)return;o.status=nx;(o.hist=o.hist||[]).push({s:nx,date:today(),by:me.name});
  if(nx==='Delivered'){o.deliveredDate=today();o.dueDate=addDays(o.deliveredDate,o.creditDays)}
  save();toast(poNo(o)+': '+PO_LABEL[nx]+(nx==='Delivered'?' · Stock has been notified to receive it':''))}

function recvSection(aw,E){if(!aw.length)return '';
  return `<div class="sec" style="margin-top:0;margin-bottom:22px"><div class="alert warn" role="status" style="margin:0"><b>Delivered by Procurement — check the goods and receive them</b><div class="small">Items count as on hand only after you receive them here.</div></div><div class="tw"><table><thead><tr><th>PO</th><th>Supplier</th><th>From request</th><th>Delivered</th><th>Items</th><th></th></tr></thead><tbody>${aw.map(o=>{const sp=supplier(o.supplierId),pr=S.prs.find(x=>x.id===o.prId);return `<tr><td class="code"><b>${poNo(o)}</b></td><td>${esc(sp?sp.name:'—')}</td><td class="code">${pr?prNo(pr)+' · '+pr.source:'—'}</td><td>${fd(o.deliveredDate)}</td><td class="small">${itemsBrief(o.items)}</td><td class="act">${E?`<button class="btn pri sm" data-act="poReceive" data-id="${o.id}">Receive</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`}

function poReceive(id){const o=po(id);
  const rows=o.items.map((i,k)=>{const it=iitem(i.itemId);return `<tr><td class="code">${it?iCode(it):''}</td><td>${esc(it?it.name:'(deleted)')}</td><td>${esc(it?it.unit:'')}</td><td class="num">${fq(i.qty)}</td><td class="num"><input class="qin" id="rq_${k}" type="number" step="any" min="0" value="${i.qty}" aria-label="Received qty ${esc(it?it.name:'')}"></td></tr>`}).join('');
  modal(`<h3>Receive ${poNo(o)} into stock</h3><p class="small muted" style="margin-top:0">${esc(supplier(o.supplierId)?.name||'')} · delivered ${fd(o.deliveredDate)}. Count the goods and enter the quantity actually received.</p><form id="rcf" class="fgrid"><div class="full tw"><table><thead><tr><th>No.</th><th>Item</th><th>Unit</th><th class="num">Ordered</th><th class="num">Received</th></tr></thead><tbody>${rows}</tbody></table></div>${field({k:'date',l:'Received date',t:'date',v:today()})}${field({k:'ref',l:'Delivery note no.'})}<div class="mact"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Receive into stock</button></div></form>`,true);
  $('#rcf').onsubmit=e=>{e.preventDefault();const date=$('#f_date').value||today(),ref=$('#f_ref').value.trim();let short=0;
    o.items.forEach((i,k)=>{const q=n($('#rq_'+k).value);i.recQty=q;if(q<n(i.qty))short++;if(q>0)S.moves.push({id:uid(),date,itemId:i.itemId,type:'IN',qty:q,ref:poNo(o)+(ref?' · '+ref:''),by:me.name})});

async function loadIpc(force){
  if(!CLOUD){IPC.raw=sampleIpc();ipcApply();return}
  if(!me||!['PM','QS','FN','SE'].includes(me.role))return;
  if(!S.subs.some(x=>x.ipcSheetId)){IPC.raw=IPC.data={linked:false};IPC.err='';return}

  try{IPC.raw=await api('ipc',{force:!!force});ipcApply()}catch(e){IPC.err=e.message;if(e.auth){sessionExpired();return}}
  IPC.busy=false;if(me)render()}
const ipcLinked=()=>!!(IPC.data&&IPC.data.linked);
const ipcProjOk=(s,c)=>!s.ipcProject||(c.project+' '+c.projectCode).toLowerCase().includes(String(s.ipcProject).trim().toLowerCase());
const ipcMatch=(s,c)=>c.src===s.ipcSheetId&&(!s.ipcContractor||c.contractor===s.ipcContractor)&&ipcProjOk(s,c);
// only contracts that belong to a linked sub-contract (its Sheet, contractor and project filter) are used anywhere
function ipcApply(){const R=IPC.raw;if(!R||!R.linked){IPC.data=R;return}const subs=S.subs.filter(x=>x.ipcSheetId);
  const cs=R.contracts.filter(c=>subs.some(s=>ipcMatch(s,c))),ids={};cs.forEach(c=>ids[c.id]=1);
  IPC.data=Object.assign({},R,{contracts:cs,claims:R.claims.filter(c=>ids[c.contractId]),works:R.works.filter(w=>cs.some(c=>c.work===w.id))})}
const ipcWorkName=id=>((IPC.data&&IPC.data.works||[]).find(w=>w.id===id)||{}).name||'';
function ipcPaidMap(){const m={};(S.ipcpay||[]).forEach(p=>m[p.claimId]=(m[p.claimId]||0)+n(p.amount));return m}
const IPC_CL={approved:'ok',submitted:'warn',returned:'bad',draft:''};
function ipcGroups(){const d=IPC.data,pm=ipcPaidMap(),g={},byC={};
  d.contracts.forEach(c=>{byC[c.id]=c;const k=c.work+'|'+c.contractor;(g[k]=g[k]||{key:k,work:c.work,contractor:c.contractor,contracts:[],value:0,approved:0,ret:0,net:0,paid:0,pending:0,pendingN:0}).contracts.push(c);g[k].value+=n(c.contractValue)});
  d.claims.forEach(cl=>{const c=byC[cl.contractId];if(!c)return;const x=g[c.work+'|'+c.contractor];
    if(cl.status==='approved'){if(/^RET/i.test(cl.ipcNo))x.ret-=n(cl.received);else{x.approved+=n(cl.current);x.ret+=n(cl.retention)}x.net+=n(cl.received);x.paid+=Math.min(n(pm[cl.id]),n(cl.received))}
    else if(cl.status==='submitted'){x.pending+=n(cl.received);x.pendingN++}});
  return Object.values(g).map(x=>Object.assign(x,{topay:r2(x.net-x.paid)})).sort((a,b)=>(ipcWorkName(a.work)+a.contractor).localeCompare(ipcWorkName(b.work)+b.contractor))}
function ipcToPay(){if(!ipcLinked())return[];const d=IPC.data,pm=ipcPaidMap(),byC={};d.contracts.forEach(c=>byC[c.id]=c);
  return d.claims.filter(cl=>cl.status==='approved'&&n(cl.received)>0&&byC[cl.contractId]).map(cl=>({cl,c:byC[cl.contractId],paid:n(pm[cl.id]),bal:r2(n(cl.received)-n(pm[cl.id]))})).filter(x=>x.bal>0.004).sort((a,b)=>a.cl.date<b.cl.date?-1:1)}
function subTabs(){const c=ipcLinked()?ipcGroups().length:'';const t=(id,l,cnt)=>`<button class="chip ${(ui.subTab||'own')===id?'on':''}" data-act="setF" data-key="subTab" data-id="${id}">${l}${cnt!==''?`<span class="c">${cnt}</span>`:''}</button>`;
  return `<div class="toolbar"><div class="chips">${t('own','This system',S.subs.length)}${t('ipc','IPC system',c)}</div></div>`}
function vIpc(){const d=IPC.data;

    if(open){const cs=g.contracts.map(c=>{const cl=IPC.data.claims.filter(x=>x.contractId===c.id);const ap=sum(cl.filter(x=>x.status==='approved'&&!/^RET/i.test(x.ipcNo)),x=>x.current);const last=cl.sort((a,b)=>b.seq-a.seq||(a.date<b.date?1:-1))[0];

    return h}).join('');

function supForm(s){const isNew=!s.id;form(isNew?'New supplier':'Edit supplier',[{k:'name',l:'Supplier name',v:s.name,req:true,full:true},{k:'contact',l:'Contact person',v:s.contact},{k:'phone',l:'Phone number',v:s.phone},{k:'days',l:'Credit term in days (0 = cash on delivery)',t:'number',v:s.days??30},{k:'category',l:'Supplies',v:s.category}],
  v=>{if(!v.name)return'Enter the supplier name';if(v.days<0)return'Credit days cannot be negative';v.credit=termLabel(v.days);if(isNew)S.suppliers.push({id:uid(),...v});else Object.assign(s,v)})}
function userForm(u){const isNew=!u.id;form(isNew?'New user':'Edit user',[{k:'name',l:'Name',v:u.name,req:true},{k:'role',l:'Role',t:'select',o:Object.entries(ROLES),v:u.role||'SE'},{k:'pin',l:isNew?'PIN':'New PIN (leave blank to keep)',t:'password',v:'',full:true}],
  v=>{if(!v.name)return'Enter a name';if(isNew&&!v.pin)return'Set a PIN';if(!isNew&&u.id===me.id&&v.role!=='PM')return'You cannot remove your own Project Manager role';
    if(isNew)S.users.push({id:uid(),...v});else{u.name=v.name;u.role=v.role;if(v.pin)u.pin=v.pin}})}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset,e)}});
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeModal()});
document.addEventListener('submit',async e=>{if(e.target.id!=='lf')return;e.preventDefault();
  if(CLOUD){const b=e.target.querySelector('button');b.disabled=true;b.textContent='Signing in…';
    try{const r=await api('login',{userId:ui.pick,pin:$('#pin').value});C.token=r.token;me={id:r.user.id};lsSet(KEY+'-tok',r.token);lsSet(KEY+'-uid',r.user.id);ui.view='dash';await reloadCloud();loadIpc()}
    catch(err){b.disabled=false;b.textContent='Sign in';toast(err.message,'bad')}return}
  const u=S.users.find(x=>x.id===ui.pick);if(u&&$('#pin').value===String(u.pin)){me=u;try{sessionStorage.setItem(KEY+'-u',u.id)}catch(err){}ui.view='dash';render()}else toast('Wrong PIN','bad')});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.cq){const c=S.claims.find(x=>x.id===ui.claimId);if(!c||c.status!=='Draft')return;const v=n(t.value);if(v>0)c.lines[t.dataset.cq]=v;else delete c.lines[t.dataset.cq];save();updClaimRow(t.dataset.cq)}
  else if(t.dataset.pq){prCtx.tmp[t.dataset.pq]=t.value;t.classList.toggle('over',n(t.value)>stockOf(t.dataset.pq).toBuy+1e-9);const c=Object.values(prCtx.tmp).filter(q=>n(q)>0).length;const el=$('#prcnt');if(el)el.textContent=`${c} item${c===1?'':'s'} in request`}
  else if(t.id==='stq'){ui.stQ=t.value;const pos=t.selectionStart;render();const s=$('#stq');if(s){s.focus();s.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.sel){t.checked?ui.sel.add(t.dataset.sel):ui.sel.delete(t.dataset.sel);render()}
  else if(t.id==='rpFrom'||t.id==='rpTo'){ui.rp=Object.assign({},ui.rp,{t:'custom',[t.id==='rpFrom'?'from':'to']:t.value});render()}});

if(CLOUD){
  bootCloud();
  setInterval(poll,30000);
  document.addEventListener('visibilitychange',poll);
  window.addEventListener('beforeunload',e=>{if(C.token&&(C.sending||C.timer||diff().cnt)){e.preventDefault();e.returnValue=''}});
}else{S=migrate(load()||seed());try{const u=sessionStorage.getItem(KEY+'-u');me=S.users.find(x=>x.id===u)||null}catch(e){}loadIpc();render()}
</script>

</body>
</html>
