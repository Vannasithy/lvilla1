<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Light theme only (by request).
   Layout: contract rail on the left, working sheet on the right; the IPC table keeps the
   Excel's Previous (red) / Current (green) / Cumulative (blue) column bands. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#152033; --muted:#5B6678; --line:#DCE2EA;
  --navy:#1F3A5F; --navy-ink:#FFFFFF; --gold:#A8761C; --gold-soft:#F6EBD3;
  --prev:#B5362A; --prev-bg:#FBECE9; --curr:#17834A; --curr-bg:#E3F3E8; --cum:#28507F; --cum-bg:#EAF0F8;
  --sec-bg:#E4EBF4; --bad:#C0392B; --bad-bg:#FDECEA; --ok:#17834A; --warn:#9A6400; --warn-bg:#FFF4DB;
  --focus:#2F6FD0;
  --f-ui:"Kantumruy Pro","Khmer OS Battambang","Leelawadee UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.muted{color:var(--muted)}
.kh{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto}
.brand h1{font-size:15px;margin:0;font-weight:700;line-height:1.2}
.brand h1 small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.spacer{flex:1}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.who select,.who input{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 8px}
.who input{width:150px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.chip.demo{background:var(--warn-bg);color:var(--warn)}
.chip.live{background:var(--curr-bg);color:var(--curr)}
.st-draft{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.st-submitted{background:var(--warn-bg);color:var(--warn)}
.st-approved{background:var(--curr-bg);color:var(--curr)}

/* shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;padding:16px;max-width:1600px;margin:0 auto}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail-h h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.search{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;width:100%}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{all:unset;cursor:pointer;display:block;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.citem:hover{border-color:var(--muted)}
.citem.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.citem b{display:block;font-size:13.5px}
.citem .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--curr)}

.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.head{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:start}
@media (max-width:700px){.head{grid-template-columns:minmax(0,1fr)}}
.head h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 18px;margin-top:12px}
.facts div{min-width:0}
.facts dt{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.facts dd{margin:0;font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.big{text-align:right}
@media (max-width:700px){.big{text-align:left}}
.big .v{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.big .l{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--focus)}

.claimbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ipc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-family:var(--f-num);font-size:12px;font-weight:500}
.ipc.on{border-color:var(--ink);background:var(--surface-2)}
.ipc .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ipc .dot.submitted{background:var(--warn)} .ipc .dot.approved{background:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.go{background:var(--curr);color:#fff;border-color:var(--curr)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 16px}
.toolbar .grow{flex:1;min-width:120px}
.note{margin:12px 16px 0;padding:10px 12px;border-radius:6px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.info{background:var(--cum-bg);color:var(--cum)}

/* IPC table */
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table.ipc-t{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13px}
.ipc-t th,.ipc-t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
.ipc-t thead th{background:var(--navy);color:var(--navy-ink);font-weight:600;font-size:12px;text-align:center;line-height:1.25;border-color:rgba(255,255,255,.18);border-right:1px solid rgba(255,255,255,.18)}
.ipc-t thead th small{display:block;font-weight:500;opacity:.8;font-size:10.5px}
.ipc-t thead th.g-prev{box-shadow:inset 0 -3px 0 #E0594A}
.ipc-t thead th.g-curr{box-shadow:inset 0 -3px 0 #2FB56A}
.ipc-t thead th.g-cum{box-shadow:inset 0 -3px 0 #6FA0DC}
.ipc-t td.r{text-align:right}
.ipc-t td.c{text-align:center}
.ipc-t .stick{position:sticky;left:0;z-index:1;background:var(--surface)}
.ipc-t thead .stick{z-index:2;background:var(--navy)}
.ipc-t tr.sec td{background:var(--sec-bg);font-weight:700}
.ipc-t tr.sec td.stick{background:var(--sec-bg)}
.ipc-t td.prev{background:var(--prev-bg);color:var(--prev)}
.ipc-t td.curr{background:var(--curr-bg);color:var(--curr)}
.ipc-t td.cum{background:var(--cum-bg);color:var(--cum)}
.ipc-t tfoot td{font-weight:700;background:var(--surface-2)}
.ipc-t tfoot tr.grand td{border-top:2px solid var(--ink)}
.ipc-t tfoot td.stick{background:var(--surface-2)}
.pin{display:inline-flex;align-items:center;border:1.5px solid var(--curr);border-radius:5px;background:var(--surface);height:28px;padding:0 6px 0 2px}
.pin input{width:58px;border:0;background:transparent;text-align:right;font-family:var(--f-num);font-size:12.5px;padding:0 2px;outline:none}
.pin span{font-size:12px;color:var(--muted)}
.pin.bad{border-color:var(--bad);background:var(--bad-bg)}
.pin:focus-within{box-shadow:0 0 0 2px var(--focus)}
.max{display:block;font-size:10.5px;color:var(--muted);font-family:var(--f-num)}
.rmk{width:100%;min-width:120px;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 6px;font-size:12.5px}
.full{display:inline-block;font-size:10px;font-weight:700;color:var(--ok);letter-spacing:.04em}

/* summary strip */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media (max-width:700px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:var(--surface);padding:12px 16px}
.sum .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sum .v{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sum .v.curr{color:var(--curr)}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:16px}
.ph{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph .img{aspect-ratio:4/3;max-width:100%;background:var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.ph .img img{width:100%;height:100%;object-fit:cover}
.ph .n{position:absolute;top:8px;left:8px;background:var(--navy);color:var(--navy-ink);font-family:var(--f-num);font-size:12px;padding:2px 8px;border-radius:4px}
.ph textarea{border:0;border-top:1px solid var(--line);background:var(--surface);padding:8px 10px;resize:vertical;min-height:58px;font-size:13px}
.ph .cap{padding:8px 10px;font-size:13px;border-top:1px solid var(--line);background:var(--surface);min-height:40px}
.ph .act{display:flex;justify-content:flex-end;padding:6px;gap:6px;background:var(--surface)}
.drop{border:1.5px dashed var(--muted);border-radius:var(--r);aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);text-align:center;padding:12px;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--curr);color:var(--curr)}
.drop b{font-size:28px;line-height:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* history */
table.ht{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
.ht th{background:var(--navy);color:var(--navy-ink);font-size:12px;font-weight:600;padding:8px;text-align:center;line-height:1.25}
.ht th small{display:block;font-weight:500;opacity:.8;font-size:10.5px}
.ht td{padding:8px;border-bottom:1px solid var(--line)}
.ht td.r{text-align:right}
.ht tr.draft td{color:var(--muted);font-style:italic}
.ht tfoot td{font-weight:700;background:var(--surface-2)}

/* BOQ editor */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px;padding:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 10px;min-width:0}
.fld input:disabled{background:transparent;border-color:transparent;padding-left:0;font-weight:600}
table.bq{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.bq th{background:var(--navy);color:var(--navy-ink);font-size:12px;font-weight:600;padding:8px;text-align:left}
.bq td{padding:4px 6px;border-bottom:1px solid var(--line)}
.bq tr.sec td{background:var(--sec-bg);font-weight:700}
.bq input{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 8px;min-width:0}
.bq input.n{text-align:right;font-family:var(--f-num);font-size:12.5px}
.bq input:disabled{border-color:transparent;background:transparent}
.bq td.r{text-align:right}
.x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-bg)}

.log{padding:0 16px 16px;font-size:12.5px;color:var(--muted)}
.log li{margin:2px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:18px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{margin:0;font-size:16px}
.modal textarea,.modal input{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px 10px;min-height:36px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

#print{display:none}
@media (prefers-reduced-motion:no-preference){.citem,.btn,.tab{transition:border-color .15s,background .15s,color .15s}}

/* ---------- PRINT (A4 landscape, paper is always white) ---------- */
@page{size:A4 landscape;margin:9mm}
@media print{
  .app,.toast,.modal-bg{display:none!important}
  #print{display:block;color:#000;background:#fff;font-family:var(--f-ui)}
  html,body{background:#fff}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .p-hd{display:grid;grid-template-columns:150px 1fr 150px;align-items:center}
  .p-hd img{height:48px}
  .p-hd .t{text-align:center}
  .p-hd .t b{display:block;font-size:17px;letter-spacing:.04em}
  .p-hd .t span{font-size:13px;font-weight:600}
  .p-title{text-align:center;font-weight:700;color:#1F3A5F;font-size:13.5px;margin:6px 0 8px;text-decoration:underline}
  .p-info{display:grid;grid-template-columns:1fr 1fr;gap:1px 30px;font-size:11px;margin-bottom:6px}
  .p-info div{display:flex;gap:6px}.p-info div span:first-child{min-width:150px;color:#333}
  .p-info b{font-weight:700}
  table.pt{border-collapse:collapse;width:100%;font-size:9.5px}
  .pt th,.pt td{border:1px solid #555;padding:2px 4px}
  .pt th{background:#1F3A5F!important;color:#fff!important;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt td.r{text-align:right;font-family:var(--f-num);font-size:9px;white-space:nowrap}
  .pt td.c{text-align:center}
  .pt tr.sec td{background:#DCE6F1!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt td.pv{background:#FBE3DF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt td.cu{background:#DDF1E4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt tr.tot td{font-weight:700}
  .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px;text-align:center;font-size:11px;break-inside:avoid}
  .sig .ln{height:54px}
  .pp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
  .pp figure{margin:0;break-inside:avoid}
  .pp .im{height:62mm;border:1px solid #777;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pp img{width:100%;height:100%;object-fit:cover}
  .pp figcaption{font-size:10.5px;padding:3px 2px;border:1px solid #777;border-top:0;min-height:22px}
  .pp figcaption b{font-family:var(--f-num);margin-right:6px}
}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.lcard img{height:56px;width:auto;align-self:center}
.lcard h2{margin:0;text-align:center;font-size:18px}
.lcard .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-top:-8px}
.lcard input{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 12px}
.lcard .btn{height:40px}
.demo-acc{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;line-height:1.6}
.demo-acc code{font-family:var(--f-num);font-size:12px}
/* user chip + nav */
.uchip{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.uchip b{font-size:13px}
.uchip span{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:4px}
.nav .btn.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tr{display:inline-block;font-size:10px;font-weight:700;color:var(--cum);letter-spacing:.04em}
.modal.wide{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal .fld input,.modal .fld select,.modal .fld textarea{height:auto;min-height:36px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
table.xt{border-collapse:collapse;width:100%;font-size:12.5px}
.xt th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.xt td{padding:5px 6px;border-bottom:1px solid var(--line)}
.xt td.r,.xt th.r{text-align:right}
.xt tr.sec td{background:var(--sec-bg);font-weight:700}
table.ut{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.ut th{background:var(--navy);color:var(--navy-ink);font-size:12px;font-weight:600;padding:8px;text-align:left}
.ut td{padding:8px;border-bottom:1px solid var(--line)}
.ut tr.off td{color:var(--muted)}
.hist{padding:0 16px 16px;font-size:12.5px;color:var(--muted)}
.hist h4{margin:8px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hist li{margin:2px 0}
.ph .img.pending img{opacity:.55}
.ph .upl{position:absolute;right:8px;bottom:8px;background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.ph .upl{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
/* work switcher + works page */
.workbtn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:4px 10px;cursor:pointer;text-align:left}
.workbtn b{font-size:13px}
.workbtn span{font-size:10.5px}
.workbtn:hover{border-color:var(--gold)}
.works-wrap{max-width:1100px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.works-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.works-h h2{margin:0;font-size:20px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.wcard:hover{border-color:var(--gold)}
.wopen{all:unset;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.wopen:focus-visible{outline:2px solid var(--focus)}
.wopen b{font-size:16px;line-height:1.3}
.wstats{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.wstats .num{font-size:15px;font-weight:600;color:var(--ink)}
.wact{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
/* retention */
.st-open{background:var(--cum-bg);color:var(--cum)}
.rsched{margin:0 16px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.rs-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px}
.rs-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.rs-l{min-width:80px;font-weight:600;display:flex;gap:6px;align-items:center}
.rs-row input.num{width:76px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;text-align:right}
.retclaim{margin:14px 16px 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.retclaim .claimbar{background:var(--surface-2)}
.retclaim textarea{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px 10px;resize:vertical}
.retclaim .fld input.num{font-family:var(--f-num)}
tr.rlink{cursor:pointer} tr.rlink:hover td{background:var(--surface-2)} tr.rlink:focus-visible{outline:2px solid var(--focus)}
/* summary */
table.sumt{min-width:1500px;font-size:12.5px}
.sumt td{white-space:nowrap} .sumt td:nth-child(14){white-space:normal;min-width:200px}
.sumt tr.retrow td{background:var(--cum-bg)}
.sumside{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:16px}
.sumside h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sumside table.ht{min-width:0}
</style>

const r6 = n => Math.round((+n||0)*1e6)/1e6;
const EPS = 0.00005;
const money = n => { n=+n||0; if(Math.abs(n)<0.005) return '–'; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const usd = n => '$ '+money(n);
const pct = f => { f=+f||0; if(Math.abs(f)<EPS) return '–'; return (f*100).toFixed(2)+'%'; };

const clone = o => JSON.parse(JSON.stringify(o));
async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const pwHash = (username,password) => sha256(String(username).trim().toLowerCase()+':'+password);

  const users=[

  ];

function upsertLocal(list,obj){ const i=DB[list].findIndex(x=>x.id===obj.id); if(i<0) DB[list].push(obj); else DB[list][i]=obj; }
function stampClaim(cl){
  cl.updatedAt=new Date().toISOString(); const c=contractOf(cl);
  if(cl.type==='RET'){ const a=+cl.amount||0, d=+cl.deduction||0; cl.summary={contractValue:c?contractValue(c):0,current:a,retention:0,received:r2(a-d),cumulative:0,balance:0,deduction:d}; return; }
  cl.summary=c?summarize(c,cl):null;
}

async function persistBatch(contracts,claims){

  contracts.forEach(c=>upsertLocal('contracts',c));   // claims need their contract for the summary
  claims.forEach(stampClaim);

  claims.forEach(cl=>upsertLocal('claims',cl)); if(!apiUrl()) saveLocal();
}

/* ---------- house location: House type · Block · House No. ---------- */
function splitLoc(s){
  s=String(s||'').trim();
  let m=s.match(/^(.*?)\s*[-–]\s*([^\s\[\]]+)\s*\[\s*#?([^\]]+)\]\s*$/) || s.match(/^(.*\S)\s+([^\s\[\]]+)\s*\[\s*#?([^\]]+)\]\s*$/);
  return m?{houseType:m[1].trim(),block:m[2].trim(),houseNo:m[3].trim()}:{houseType:'',block:'',houseNo:''};
}
const composeLoc = c => [c.houseType, (c.block||c.houseNo)?`${c.block||''}${c.houseNo?` [${c.houseNo}]`:''}`.trim():''].filter(Boolean).join(' - ');
function houseFields(c){ if(c.block||c.houseNo||c.houseType) return {houseType:c.houseType||'',block:c.block||'',houseNo:c.houseNo||''}; return splitLoc(c.location); }
const natCmp = (a,b) => String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});
const houseSort = (a,b) => { const x=houseFields(a), y=houseFields(b); return natCmp(x.block,y.block)||natCmp(x.houseNo,y.houseNo)||natCmp(x.houseType,y.houseType)||natCmp(a.contractor,b.contractor); };

/* ---------- calculations ---------- */
const contractOf = cl => DB.contracts.find(c=>c.id===cl.contractId);
const claimsOf = c => DB.claims.filter(x=>x.contractId===c.id && x.type!=='RET').sort((a,b)=>a.seq-b.seq);   // IPC claims only
const userName = id => (DB.users.find(u=>u.id===id)||{}).name || '—';
const engineers = () => DB.users.filter(u=>u.role==='SE' && u.active!==false);
const capOf = it => it.cap==null ? 1 : +it.cap;          // max cumulative % (below 100% after a contractor transfer)
const itemAmt = it => r2((+it.qty||0)*(+it.rate||0));
const allItems = c => c.sections.flatMap(s=>s.items);
const contractValue = c => r2(allItems(c).reduce((t,it)=>t+itemAmt(it),0));
const transferredOut = c => r2(allItems(c).reduce((t,it)=>t+(it.cap==null?0:itemAmt(it)*(1-capOf(it))),0));
const netValue = c => r2(contractValue(c)-transferredOut(c));
const approvedPct = (c,itemId) => claimsOf(c).filter(x=>x.status==='approved').reduce((s,x)=>s+(+x.lines[itemId]||0),0);
/* Previous = all APPROVED claims before this one (current claim excluded). */
const prevPct = (c,cl,itemId) => claimsOf(c).filter(x=>x.status==='approved'&&x.seq<cl.seq).reduce((s,x)=>s+(+x.lines[itemId]||0),0);
function calc(c,cl){
  const out={sections:[],tot:{amt:0,prev:0,curr:0,cum:0}};
  c.sections.forEach(sec=>{
    const S={sec,rows:[],amt:0,prev:0,curr:0,cum:0};
    sec.items.forEach(it=>{
      const amt=itemAmt(it), pp=prevPct(c,cl,it.id), cp=+cl.lines[it.id]||0;
      const row={it,amt,pp,cp,cumP:pp+cp,prev:r2(amt*pp),curr:r2(amt*cp),room:Math.max(0,capOf(it)-pp)};
      row.cum=r2(row.prev+row.curr);
      S.rows.push(row); S.amt+=amt; S.prev+=row.prev; S.curr+=row.curr; S.cum+=row.cum;
    });
    out.sections.push(S);
    ['amt','prev','curr','cum'].forEach(k=>out.tot[k]+=S[k]);
  });
  const t=out.tot, rp=+c.retention||0;
  t.ret={amt:r2(t.amt*rp),prev:r2(t.prev*rp),curr:r2(t.curr*rp),cum:r2(t.cum*rp)};
  t.net={amt:r2(t.amt-t.ret.amt),prev:r2(t.prev-t.ret.prev),curr:r2(t.curr-t.ret.curr),cum:r2(t.cum-t.ret.cum)};
  return out;
}
function summarize(c,cl){
  const t=calc(c,cl).tot, nv=netValue(c);
  return {contractValue:r2(t.amt),transferredOut:transferredOut(c),current:r2(t.curr),retention:t.ret.curr,received:t.net.curr,cumulative:r2(t.cum),balance:r2(nv-t.cum)};
}
function approvedProgress(c){
  const v=netValue(c); if(!v) return 0;
  return allItems(c).reduce((s,it)=>s+itemAmt(it)*approvedPct(c,it.id),0)/v;
}
const hasRemaining = c => allItems(c).some(it=>itemAmt(it)>0 && capOf(it)-approvedPct(c,it.id)>EPS);

const owns = c => !!c && !!me() && c.engineerId===me().id;
const can = {
  editCurrent: (cl,c) => !isQS() && owns(c) && cl && cl.status==='draft',
  newClaim: c => !isQS() && owns(c) && !claimsOf(c).some(x=>x.status!=='approved') && hasRemaining(c),
  review: cl => isQS() && cl && cl.status==='submitted',
  editBoq: () => isQS()
};
const curContract = () => myContracts().find(c=>c.id===UI.contractId);
const curClaim = () => DB.claims.find(x=>x.id===UI.claimId);

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
}
async function guard(fn){
  document.body.style.cursor='progress';
  try{ await fn(); } catch(e){ if(e.message!=='Signed out') toast('Not saved: '+e.message); console.error(e); }
  finally{ document.body.style.cursor=''; }
}

function renderList(){
  const q=UI.q.toLowerCase();
  const list=myContracts().filter(c=>{ const h=houseFields(c); return !q||(c.location+' '+h.block+' '+h.houseNo+' '+h.houseType+' '+c.contractor+' '+c.workType+' '+userName(c.engineerId)+' '+c.projectCode).toLowerCase().includes(q); }).sort(houseSort);
  $('#clist').innerHTML = list.length? list.map(c=>{
    const open=claimsOf(c).find(x=>x.status!=='approved');
    const p=approvedProgress(c);
    return `<button class="citem ${c.id===UI.contractId?'on':''}" data-id="${c.id}">
      ${(()=>{ const h=houseFields(c); return h.block||h.houseNo ? `<b>Block ${esc(h.block)} · #${esc(h.houseNo)}</b><div class="meta"><span>${esc(h.houseType)}</span></div>` : `<b>${esc(c.location||'(no location)')}</b>`; })()}
      <div class="meta"><span>${esc(c.contractor)}</span><span class="num">${usd(netValue(c))}</span></div>
      <div class="meta"><span>${isQS()?esc(userName(c.engineerId)):esc(c.projectCode)}</span>${open?`<span class="chip st-${open.status}" style="height:18px;font-size:10.5px">${pad3(open.seq)} ${STATUS[open.status].en}</span>`:retBadge(c)}</div>
      <div class="bar" title="Approved progress ${pct(p)}"><i style="width:${Math.min(100,p*100)}%"></i></div>
    </button>`;}).join('') : `<div class="empty">${q?'No houses match this search.':(isQS()?'No contracts yet.':'No houses are assigned to you yet. Ask QS to assign your houses.')}</div>`;
  document.querySelectorAll('.citem').forEach(b=>b.onclick=()=>{
    if(UI.dirty) return toast('Save or submit your changes first.');
    UI.contractId=b.dataset.id; UI.claimId=null; UI.boqDraft=null; render();});
}

/* ---------- render: contract ---------- */

  const m=$('#main'); const c=curContract();
  if(!c){
    const mine=myContracts();
    if(mine.length){ UI.contractId=mine[0].id; return renderMain(); }
    m.innerHTML=`<div class="panel empty">${isQS()?'No contracts yet. Click “+ New” to set up the first sub-contract and its BOQ.':'No houses are assigned to you yet. Ask QS to assign your houses.'}</div>`; return;
  }
  const cls=claimsOf(c);
  if(!UI.claimId || !cls.find(x=>x.id===UI.claimId)) UI.claimId = cls.length? cls[cls.length-1].id : null;
  const cl=curClaim(); const v=contractValue(c), out=transferredOut(c), p=approvedProgress(c);
  const notes=[];
  if(c.transferFrom) notes.push(`<div class="note info">Remaining work taken over from <b>${esc(c.transferFrom.contractor)}</b> (${esc(c.transferFrom.code)}, ${esc(c.transferFrom.location)}) on ${fmtDate(c.transferFrom.at)}.${c.transferFrom.note?' '+esc(c.transferFrom.note):''}</div>`);
  (c.transfers||[]).forEach(t=>notes.push(`<div class="note warn">${usd(t.amount)} of remaining work was transferred to <b>${esc(t.contractor)}</b> (${esc(t.code)}) on ${fmtDate(t.at)}. Those items are closed at their approved %.</div>`));
  m.innerHTML=`
  <section class="panel">
    <div class="head">
      <div style="min-width:0">
        <div class="muted" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">${esc(c.project)} · ${esc(c.projectCode)}</div>
        <h2>${(()=>{ const h=houseFields(c); return h.block||h.houseNo?`Block ${esc(h.block)} · House #${esc(h.houseNo)}`:esc(c.location); })()}</h2>
        <div class="sub" style="font-weight:600">${esc(houseFields(c).houseType)}</div>
        <div class="sub">${esc(c.workType)}</div>
        <dl class="facts">
          <div><dt>Contractor · អ្នកម៉ៅការ</dt><dd>${esc(c.contractor)}</dd></div>
          <div><dt>Site engineer</dt><dd>${esc(userName(c.engineerId))}</dd></div>
          <div><dt>Payment term</dt><dd>${esc(c.terms)}</dd></div>
          <div><dt>Retention</dt><dd class="num">${((+c.retention||0)*100).toFixed(0)}%</dd></div>
          <div><dt>Approved progress</dt><dd class="num">${pct(p)}</dd></div>
        </dl>
      </div>
      <div class="big"><div class="l">Contract value</div><div class="v">${usd(v)}</div>
        ${out?`<div class="muted num" style="font-size:12px">Transferred out −${money(out)} · net ${money(v-out)}</div>`:''}
        <div class="bar" style="width:180px;margin-left:auto"><i style="width:${Math.min(100,p*100)}%"></i></div></div>
    </div>
    ${notes.join('')}
    <nav class="tabs" role="tablist" style="margin-top:${notes.length?'12px':'0'}">
      ${[['ipc','IPC Breakdown','តារាងស្នើ'],['photo','Photos','រូបភាព'],['hist','Payment History','ប្រវត្តិ'],['ret','Retention','ប្រាក់រក្សាទុក'],['boq','Contract & BOQ','កិច្ចសន្យា']].map(([k,en,kh])=>
        `<button class="tab ${UI.tab===k?'on':''}" data-tab="${k}" role="tab" aria-selected="${UI.tab===k}">${en} <span class="muted" style="font-weight:500">${kh}</span></button>`).join('')}

    ${UI.tab==='ipc'||UI.tab==='photo' ? claimBar(c,cls,cl) : ''}

function claimBar(c,cls,cl){
  return `<div class="claimbar">
    <span class="muted" style="font-size:12px;margin-right:4px">Claims</span>

    <span class="spacer"></span>
    ${cl?`<span class="chip st-${cl.status}">${STATUS[cl.status].en} · ${STATUS[cl.status].kh}</span>`:''}
    ${cl&&!isFramed?'<button class="btn sm" id="btnPrint">Print / PDF</button>':''}

}

/* ---------- IPC breakdown tab ---------- */
function renderIPC(tb,c,cl){
  if(!cl){ tb.innerHTML=`<div class="empty">No claims yet for this house. ${owns(c)?'Click “+ New claim” to start IPC 001.':'The assigned site engineer starts each claim.'}</div>`; return; }
  const k=calc(c,cl), ed=can.editCurrent(cl,c);
  const lastReturn=[...(cl.log||[])].reverse().find(l=>l.action==='returned');
  let n=0; const notes=[];
  if(cl.imported) notes.push(`<div class="note info">Imported from Excel: this shows all progress up to ${esc(cl.ipcNo)} as one approved claim. It counts as “Previous” for the next claim.</div>`);
  if(cl.sample) notes.push(`<div class="note warn">Sample claim with example percentages. It shows how the sheet works and is not real progress.</div>`);
  if(cl.status==='draft'&&lastReturn) notes.push(`<div class="note bad"><b>Returned by ${esc(lastReturn.by)}:</b> ${esc(lastReturn.note||'No reason given')}</div>`);
  if(ed) notes.push(`<div class="note info">Enter <b>this claim's % only</b> in the green column. Previous comes from approved claims; Cumulative = Previous + Current and cannot exceed 100%.</div>`);
  if(cl.status==='submitted'&&!isQS()) notes.push(`<div class="note info">Submitted. Waiting for QS to approve.</div>`);
  if(cl.status==='draft'&&isQS()) notes.push(`<div class="note info">Draft. ${esc(userName(c.engineerId))} is still filling this in.</div>`);
  tb.innerHTML=`
  ${notes.join('')}
  <div class="toolbar">
    <div class="fld" style="max-width:200px"><label for="ipcNo">IPC No. · លេខ IPC</label><input id="ipcNo" value="${esc(cl.ipcNo)}" disabled></div>
    <div class="fld" style="max-width:170px"><label for="ipcDate">Date · កាលបរិច្ឆេទ</label><input id="ipcDate" type="date" value="${esc(cl.date)}" ${ed?'':'disabled'}></div>
    <div class="fld" style="max-width:220px"><label for="prepBy">Prepared by (Site Engineer)</label><input id="prepBy" value="${esc(cl.preparedBy||'')}" disabled></div>
    <div class="fld" style="max-width:240px"><label for="smName">Checked by (Site Manager)</label><input id="smName" value="${esc(cl.siteManager||'')}" placeholder="Site Manager name" ${ed?'':'disabled'}></div>
    <div class="grow"></div>
    ${actionButtons(cl,c)}
  </div>
  <div class="tw"><table class="ipc-t">
    <thead>
      <tr>

function totRow(label,key,o,grand){

    <td class="r num">${money(o.amt)}</td>
    <td class="r num">${money(o.prev)}</td><td class="r num">${pct(p(o.prev))}</td>
    <td class="r num" data-f="${key}-curr">${money(o.curr)}</td><td class="r num" data-f="${key}-currp">${pct(p(o.curr))}</td>
    <td class="r num" data-f="${key}-cum">${money(o.cum)}</td><td class="r num" data-f="${key}-cump">${pct(p(o.cum))}</td><td></td></tr>`;
}

function logList(cl){
  if(!cl.log||!cl.log.length) return '';
  const verbs={submitted:'Submitted',approved:'Approved',returned:'Returned',created:'Created',handover:'Handed over',imported:'Imported'};
  return `<ul class="log">${cl.log.map(l=>`<li>${new Date(l.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} — ${verbs[l.action]||esc(l.action)} by ${esc(l.by||'?')}${l.note?': '+esc(l.note):''}</li>`).join('')}</ul>`;
}
function setF(key,val){ const el=document.querySelector(`[data-f="${key}"]`); if(el) el.textContent=val; }
function refreshFigures(c,cl){
  const k=calc(c,cl);
  k.sections.forEach(S=>{
    setF('sc-'+S.sec.id,money(S.curr)); setF('su-'+S.sec.id,money(S.cum));
    S.rows.forEach(R=>{ setF('ca-'+R.it.id,money(R.curr)); setF('cu-'+R.it.id,money(R.cum)); setF('cp-'+R.it.id,pct(R.cumP)); });
  });
  const T=k.tot, p=x=>T.amt?x/T.amt:0;
  [['t',T],['r',T.ret],['n',T.net]].forEach(([key,o])=>{
    setF(key+'-curr',money(o.curr)); setF(key+'-currp',pct(p(o.curr))); setF(key+'-cum',money(o.cum)); setF(key+'-cump',pct(p(o.cum)));
  });
  const nv=netValue(c); setF('s-net',usd(T.net.curr)); setF('s-cum',pct(nv?T.cum/nv:0));
}
function invalidLines(c,cl){
  return allItems(c).filter(it=>{ const cp=+cl.lines[it.id]||0; return cp<0 || prevPct(c,cl,it.id)+cp>capOf(it)+EPS; });
}
function addLog(cl,action,note){ (cl.log=cl.log||[]).push({at:new Date().toISOString(),by:me().name,role:me().role,action,note:note||''}); }
function bindIPC(c,cl){
  document.querySelectorAll('.pin input').forEach(inp=>{
    inp.oninput=()=>{
      const raw=inp.value.replace(',','.').trim(); const room=+inp.dataset.room;
      const v = raw===''?0:Number(raw)/100;
      const lab=inp.closest('.pin'); const bad = isNaN(v) || v<0 || v>room+EPS;
      lab.classList.toggle('bad',bad); lab.title = bad ? `Must be between 0% and ${(room*100).toFixed(2)}%` : '';
      if(!isNaN(v)){ if(v) cl.lines[inp.dataset.item]=r6(v); else delete cl.lines[inp.dataset.item]; }
      UI.dirty=true; refreshFigures(c,cl);
    };
    inp.onkeydown=e=>{ if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
      const all=[...document.querySelectorAll('.pin input')]; const i=all.indexOf(inp)+(e.key==='ArrowUp'?-1:1);
      if(all[i]){ all[i].focus(); all[i].select(); } } };
  });
  document.querySelectorAll('[data-rmk]').forEach(inp=>inp.oninput=()=>{ const v=inp.value.trim(); if(v) cl.remarks[inp.dataset.rmk]=v; else delete cl.remarks[inp.dataset.rmk]; UI.dirty=true; });
  const d=$('#ipcDate'); if(d&&!d.disabled) d.onchange=()=>{cl.date=d.value;UI.dirty=true;};
  const sm=$('#smName'); if(sm&&!sm.disabled) sm.oninput=()=>{cl.siteManager=sm.value.trim();UI.dirty=true;};
  const on=(id,fn)=>{const b=$('#'+id); if(b) b.onclick=fn;};
  on('btnSave',()=>UI.uploading?toast('Wait until the photos finish uploading.'):guard(async()=>{ cl.preparedBy=me().name; await persistClaim(cl); UI.dirty=false; toast('Draft saved'); renderList(); }));
  on('btnSubmit',async()=>{
    if(!(cl.siteManager||'').trim()){ toast('Enter the Site Manager name in “Checked by”.'); $('#smName').focus(); return; }
    const bad=invalidLines(c,cl);
    if(bad.length){ toast(`Fix ${bad.length} item(s): cumulative is over the allowed %.`); return; }
    if(!Object.values(cl.lines).some(v=>v>0)){ toast('Enter at least one current % before submitting.'); return; }
    if(UI.uploading){ toast('Wait until the photos finish uploading.'); return; }
    if(!(cl.photos||[]).length){ toast('Add at least one progress photo in the Photos tab.'); UI.tab='photo'; renderMain(); return; }
    await guard(async()=>{ cl.status='submitted'; cl.preparedBy=me().name; cl.sample=false; addLog(cl,'submitted'); await persistClaim(cl); UI.dirty=false; toast('Submitted for approval'); render(); });
  });
  on('btnDel',async()=>{
    if(UI.delArm!==cl.id){ UI.delArm=cl.id; renderMain(); setTimeout(()=>{ if(UI.delArm===cl.id){UI.delArm=null; if(UI.tab==='ipc') renderMain();} },4000); return; }
    UI.delArm=null; await guard(async()=>{ await removeClaim(cl); UI.claimId=null; UI.dirty=false; toast('Draft deleted'); render(); });
  });
  on('btnApprove',()=>guard(async()=>{ cl.status='approved'; cl.approvedBy=me().name; addLog(cl,'approved'); await persistClaim(cl); toast(`${cl.ipcNo} approved`); render(); }));
  on('btnReturn',()=>formModal('Return claim to site engineer',
    `<div class="fld"><label for="rn">What needs to change?</label><textarea id="rn" rows="3"></textarea></div>`,'Return claim',
    async bg=>{ const note=bg.querySelector('#rn').value.trim(); if(!note) return 'Write the reason so the engineer knows what to fix.';
      cl.status='draft'; addLog(cl,'returned',note); await persistClaim(cl); toast('Returned to engineer'); render(); }));
}
async function newClaim(c){
  const cls=claimsOf(c); const seq=Math.max((cls.length?Math.max(...cls.map(x=>x.seq)):0)+1, c.nextSeq||1);
  const cl={id:uid('cl'),contractId:c.id,seq,ipcNo:`IPC_${c.projectCode}-${pad3(seq)}`,date:today(),status:'draft',lines:{},remarks:{},photos:[],

/* ---------- Photos tab ---------- */
function renderPhotos(tb,c,cl){
  if(!cl){ tb.innerHTML='<div class="empty">Start a claim first. Photos belong to a claim.</div>'; return; }
  const ed=can.editCurrent(cl,c); const ph=cl.photos||[];
  tb.innerHTML=`
    <div class="note info">${cl.type==='RET'?`Photos for <b>${esc(cl.ipcNo)}</b>: the house condition at the defect inspection.`:`Photos for <b>${esc(cl.ipcNo)}</b> only: this period's progress.`} Write what each photo shows below it.</div>
    <div class="pgrid">
      ${ph.map((p,i)=>`<figure class="ph" style="margin:0">
        <div class="img ${p.pending?'pending':''}" data-ph="${p.id}"><span class="n">${i+1}</span><img src="${esc(p.src)}" alt="${esc(p.caption||'Progress photo '+(i+1))}" loading="lazy">${p.pending?'<span class="upl">Uploading…</span>':''}</div>
        ${ed?`<textarea data-cap="${p.id}" placeholder="Description · បរិយាយ (e.g. ការ៉ូបាតផ្ទះ ជាន់ផ្ទាល់ដី 50%)" aria-label="Description for photo ${i+1}">${esc(p.caption||'')}</textarea>
          <div class="act"><button class="x" data-up="${p.id}" title="Move earlier" aria-label="Move earlier">◀</button><button class="x" data-dn="${p.id}" title="Move later" aria-label="Move later">▶</button><button class="x" data-rm="${p.id}">Remove</button></div>`
          :`<figcaption class="cap">${esc(p.caption||'—')}</figcaption>`}
      </figure>`).join('')}
      ${ed && ph.length<CONFIG.MAX_PHOTOS?`<label class="drop" id="drop" for="file"><b>+</b><span>Add photos<br><span style="font-size:12px">Click or drop images · ${ph.length}/${CONFIG.MAX_PHOTOS}</span></span></label><input id="file" type="file" accept="image/*" multiple hidden>`:''}
    </div>
    ${!ph.length&&!ed?'<div class="empty">No photos in this claim.</div>':''}
    ${ed?`<div class="toolbar"><div class="grow"></div><button class="btn" id="btnSaveP">Save photos</button></div>`:''}`;
  if(!ed) return;
  const add=async files=>{
    const room=CONFIG.MAX_PHOTOS-(cl.photos||[]).length;
    const list=[...files].filter(f=>f.type.startsWith('image/')).slice(0,room);
    if(!list.length) return;
    // 1) show every photo at once from the phone/PC file, so captions can be typed straight away
    const jobs=list.map(f=>{ const p={id:uid('ph'),src:URL.createObjectURL(f),caption:'',pending:true}; (cl.photos=cl.photos||[]).push(p); return {f,p}; });
    UI.uploading=(UI.uploading||0)+jobs.length; UI.dirty=true;
    renderPhotos(tb,c,cl);
    // 2) shrink + upload several at a time in the background
    let failed=0;
    const one=async ({f,p})=>{
      try{
        const data=await shrink(f);
        const url=await uploadPhoto(data,`${cl.ipcNo}_${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`);
        URL.revokeObjectURL(p.src); p.src=url; delete p.pending;
        const box=document.querySelector(`[data-ph="${p.id}"]`);
        if(box){ box.classList.remove('pending'); const u=box.querySelector('.upl'); if(u) u.remove(); box.querySelector('img').src=url; }
      }catch(e){ failed++; cl.photos=cl.photos.filter(x=>x.id!==p.id); }
      finally{ UI.uploading--; }
    };
    const queue=[...jobs];
    await Promise.all(Array.from({length:Math.min(CONFIG.PHOTO_PARALLEL,queue.length)},async()=>{ while(queue.length) await one(queue.shift()); }));
    // 3) one save for the whole batch (captions typed meanwhile are included)
    if(!UI.uploading) await guard(async()=>{ await persistClaim(cl); UI.dirty=false; });   // last batch to finish saves
    if(failed) toast(`${failed} photo(s) failed to upload. Check the connection and add them again.`);
    else toast(`${jobs.length} photo(s) uploaded`);
    if(tb.isConnected) renderPhotos(tb,c,cl);
  };
  const fi=$('#file'); if(fi) fi.onchange=()=>add(fi.files);
  const dr=$('#drop');
  if(dr){ dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')}; dr.ondragleave=()=>dr.classList.remove('over');
    dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');add(e.dataTransfer.files)}; }
  tb.querySelectorAll('[data-cap]').forEach(t=>t.oninput=()=>{const p=cl.photos.find(x=>x.id===t.dataset.cap); p.caption=t.value; UI.dirty=true;});
  tb.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cl.photos=cl.photos.filter(x=>x.id!==b.dataset.rm); UI.dirty=true; renderPhotos(tb,c,cl);});
  const mv=(id,d)=>{const i=cl.photos.findIndex(x=>x.id===id),j=i+d; if(j<0||j>=cl.photos.length)return; [cl.photos[i],cl.photos[j]]=[cl.photos[j],cl.photos[i]]; UI.dirty=true; renderPhotos(tb,c,cl);};
  tb.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
  tb.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
  $('#btnSaveP').onclick=()=>{ if(UI.uploading) return toast('Wait until the photos finish uploading.'); guard(async()=>{await persistClaim(cl);UI.dirty=false;toast('Photos saved');}); };
}
async function shrink(file){
  // createImageBitmap decodes faster and uses less memory than FileReader + <img> (falls back on old browsers)
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('Unsupported image')); im.src=URL.createObjectURL(file); });
  }
  const w=src.width,h=src.height, s=Math.min(1,CONFIG.PHOTO_MAX_PX/Math.max(w,h));
  const cv=document.createElement('canvas'); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  if(src.close) src.close();
  return cv.toDataURL('image/jpeg',CONFIG.PHOTO_QUALITY);
}

/* retention release schedule (contract) */
function retSchedForm(d,ed){
  const s=retSchedule(d), two=s.length>1, dis=ed?'':'disabled';
  const v=(i,k)=>s[i]?(k==='pct'?+(s[i].pct*100).toFixed(2):s[i].months):(k==='pct'?50:12);
  return `<div class="rsched">
    <div class="rs-h"><b>Retention release · ការដោះលែងប្រាក់រក្សាទុក</b><span class="muted">Months are counted from the date the work is 100% approved (start of DLP).</span></div>
    <div class="rs-row"><span class="rs-l">Stage 1</span><input id="rs1p" class="num" inputmode="decimal" value="${v(0,'pct')}" ${dis}><span>% of retention after</span><input id="rs1m" class="num" inputmode="numeric" value="${v(0,'months')}" ${dis}><span>months</span></div>
    <div class="rs-row"><label class="rs-l"><input type="checkbox" id="rs2on" ${two?'checked':''} ${dis}> Stage 2</label><input id="rs2p" class="num" inputmode="decimal" value="${two?v(1,'pct'):50}" ${dis||(two?'':'disabled')}><span>% of retention after</span><input id="rs2m" class="num" inputmode="numeric" value="${two?v(1,'months'):12}" ${dis||(two?'':'disabled')}><span>months</span></div>
  </div>`;
}
function bindRetSched(tb,d){
  const g=id=>tb.querySelector('#'+id); if(!g('rs1p')) return;
  const read=()=>{ const st=[{pct:(Number(g('rs1p').value.replace(',','.'))||0)/100,months:parseInt(g('rs1m').value,10)||0}];
    if(g('rs2on').checked) st.push({pct:(Number(g('rs2p').value.replace(',','.'))||0)/100,months:parseInt(g('rs2m').value,10)||0});
    d.retSchedule=st; };
  ['rs1p','rs1m','rs2p','rs2m'].forEach(id=>g(id).oninput=read);
  g('rs2on').onchange=()=>{ const on=g('rs2on').checked; g('rs2p').disabled=g('rs2m').disabled=!on;
    if(on && Math.abs((Number(g('rs1p').value)||0)-100)<0.01){ g('rs1p').value=50; g('rs2p').value=50; }
    if(!on){ g('rs1p').value=100; } read(); };
}
function retSchedError(d){
  const s=retSchedule(d), sum=s.reduce((a,x)=>a+(+x.pct||0),0);
  if(s.some(x=>!(x.pct>0))) return 'Each retention stage needs a % above 0.';
  if(Math.abs(sum-1)>0.0001) return `Retention stages must add up to 100% (now ${(sum*100).toFixed(2)}%).`;
  if(s.some(x=>!(x.months>=0))) return 'Enter the months for each retention stage.';
  if(s.length>1 && s[1].months<=s[0].months) return 'Stage 2 must be later than stage 1.';
  return '';
}
function historyList(c){
  const eng=(c.engineerLog||[]), tr=(c.transfers||[]);

}

/* ---------- Retention release (RET claims) ----------
   Retention held = retention of every APPROVED IPC.  Clock (DLP) starts on the date the work became 100% approved.
   Release schedule is set per contract: 1 or 2 stages, each "% of retention after N months".
   Each stage is requested by the site engineer (RET claim) and approved by QS, with an optional deduction. */
const isRet = cl => !!cl && cl.type==='RET';
const retClaimsOf = c => DB.claims.filter(x=>x.contractId===c.id && isRet(x)).sort((a,b)=>(a.stage-b.stage)||((a.rseq||0)-(b.rseq||0)));
const retSchedule = c => (Array.isArray(c.retSchedule) && c.retSchedule.length) ? c.retSchedule : [{pct:1,months:12}];
const addMonthsISO = (iso,m) => { const d=new Date(String(iso).slice(0,10)+'T00:00:00Z'); const day=d.getUTCDate(); d.setUTCMonth(d.getUTCMonth()+(+m||0)); if(d.getUTCDate()<day) d.setUTCDate(0); return d.toISOString().slice(0,10); };
const approvedAt = cl => { const l=[...(cl.log||[])].reverse().find(x=>x.action==='approved'||x.action==='imported'); return String((l&&l.at)||cl.updatedAt||cl.date||'').slice(0,10); };
const RSTATE = {
  held:{en:'Not started',kh:'មិនទាន់ចាប់ផ្តើម',cls:'st-draft'}, waiting:{en:'Waiting',kh:'កំពុងរង់ចាំ',cls:'st-draft'},
  open:{en:'Open for request',kh:'អាចស្នើបាន',cls:'st-open'}, draft:{en:'Draft',kh:'សេចក្តីព្រាង',cls:'st-draft'},
  submitted:{en:'Submitted',kh:'បានស្នើ',cls:'st-submitted'}, released:{en:'Released',kh:'បានដោះលែង',cls:'st-approved'}
};
function retInfo(c){
  const appr=claimsOf(c).filter(x=>x.status==='approved');
  const held=r2(appr.reduce((s,cl)=>s+calc(c,cl).tot.ret.curr,0));
  const complete=appr.length>0 && !hasRemaining(c);
  const completedAt=complete ? appr.map(approvedAt).sort().pop() : '';
  const rets=retClaimsOf(c), now=today(); let acc=0;
  const sched=retSchedule(c);
  const stages=sched.map((s,i)=>{
    const last=i===sched.length-1, amount=last?r2(held-acc):r2(held*(+s.pct||0)); acc=r2(acc+amount);
    const due=completedAt?addMonthsISO(completedAt,s.months):'';
    const claim=rets.filter(r=>r.stage===i+1).slice(-1)[0];
    let state=!complete?'held':(now<due?'waiting':'open');
    if(claim) state=claim.status==='approved'?'released':claim.status;
    const daysLeft=due?Math.ceil((Date.parse(due)-Date.parse(now))/864e5):null;
    return {no:i+1,pct:+s.pct||0,months:+s.months||0,amount,due,state,claim,daysLeft};
  });
  const ok=rets.filter(r=>r.status==='approved');
  const released=r2(ok.reduce((s,r)=>s+(+r.amount||0)-(+r.deduction||0),0)), deducted=r2(ok.reduce((s,r)=>s+(+r.deduction||0),0));
  return {rate:+c.retention||0,held,complete,completedAt,stages,released,deducted,balance:r2(held-released-deducted),
          progress:approvedProgress(c)};
}
function retBadge(c){
  const R=retInfo(c); if(!R.complete) return '';
  if(R.stages.some(s=>s.state==='submitted')) return '<span class="chip st-submitted" style="height:18px;font-size:10.5px">RET submitted</span>';
  if(R.stages.some(s=>s.state==='open'||s.state==='draft')) return '<span class="chip st-open" style="height:18px;font-size:10.5px">Retention due</span>';
  if(R.stages.every(s=>s.state==='released')) return '<span class="chip st-approved" style="height:18px;font-size:10.5px">Closed</span>';
  return '<span class="chip st-approved" style="height:18px;font-size:10.5px">Complete</span>';
}
function stateLabel(st){
  const s=RSTATE[st.state]; let t=s.en;
  if(st.state==='waiting' && st.daysLeft!=null) t+=` · ${st.daysLeft} day${st.daysLeft===1?'':'s'}`;
  return `<span class="chip ${s.cls}">${t}</span>`;
}

   One table for ALL works of this project, same columns as "SUMMARY LABOR CLAIM" in TOTAL_SUMMARY_TO_FINANCE.xlsx:
   No · Request By · Type House · Block · N · BOQ · CLAIMED · BALANCE · THIS CLAIM · Retention · REQUEST · SUBCON. · SCOPE OF WORK · REMARK */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=XLSX_URL; sc.onload=res; sc.onerror=()=>rej(new Error('Could not load the Excel writer. Check the internet connection.')); document.head.appendChild(sc); });
}
const ipcCurr = (c,cl) => allItems(c).reduce((t,it)=>t+r2(itemAmt(it)*(+((cl.lines||{})[it.id])||0)),0);
async function fetchProject(){
  if(apiUrl()) return (await call('exportAll')).works;
  return LS.get(KEY.works,[]).map(w=>{ const d=LS.get(KEY.data(w.id),{contracts:[],claims:[]}); return {id:w.id,name:w.name,contracts:d.contracts||[],claims:d.claims||[]}; });
}
function summaryRows(works,o){
  const rows=[];
  works.forEach(w=>{
    const byC={}; (w.claims||[]).forEach(cl=>{ (byC[cl.contractId]=byC[cl.contractId]||[]).push(cl); });
    (w.contracts||[]).forEach(c=>{
      const cs=byC[c.id]||[], h=houseFields(c), boq=netValue(c), rate=+c.retention||0;
      const ipcAppr=cs.filter(x=>x.type!=='RET'&&x.status==='approved');
      cs.forEach(cl=>{
        if(!(cl.date>=o.from && cl.date<=o.to)) return;
        if(!o.status.includes(cl.status)) return;
        const ret=cl.type==='RET';
        if(ret ? !o.inclRet : !o.inclIpc) return;
        let thisClaim, retAmt, request, claimed, remark=[];
        if(ret){
          claimed=r2(ipcAppr.reduce((t,x)=>t+ipcCurr(c,x),0));
          thisClaim=r2((+cl.amount||0)-(+cl.deduction||0)); retAmt=0; request=thisClaim;
          remark.push(`Retention release stage ${cl.stage}`); if(+cl.deduction) remark.push(`deducted ${money(cl.deduction)}${cl.deductionNote?' ('+cl.deductionNote+')':''}`);
        } else {
          thisClaim=r2(ipcCurr(c,cl));
          const prev=ipcAppr.filter(x=>x.seq<cl.seq).reduce((t,x)=>t+ipcCurr(c,x),0);
          claimed=r2(prev+thisClaim); retAmt=r2(thisClaim*rate); request=r2(thisClaim-retAmt);
        }
        remark.unshift(cl.ipcNo); if(cl.status!=='approved') remark.push(STATUS[cl.status].en);
        rows.push({requestBy:cl.preparedBy||'',houseType:h.houseType,block:h.block,houseNo:h.houseNo,location:c.location,boq:r2(boq),claimed,balance:r2(boq-claimed),
          thisClaim,ret:retAmt,request,subcon:c.contractor||'',scope:c.workType||w.name,work:w.name,remark:remark.join(' · '),date:cl.date,type:ret?'RET':'IPC'});
      });
    });
  });
  rows.sort((a,b)=>natCmp(a.requestBy,b.requestBy)||natCmp(a.houseType,b.houseType)||natCmp(a.block,b.block)||natCmp(a.houseNo,b.houseNo)||natCmp(a.scope,b.scope));
  return rows;
}
function periodDefault(){            // 1–15 or 16–end of the current month (your pay periods)
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(), day=d.getDate(), p=n=>String(n).padStart(2,'0');
  if(day<=15) return {from:`${y}-${p(m+1)}-01`,to:`${y}-${p(m+1)}-15`};
  const last=new Date(y,m+1,0).getDate(); return {from:`${y}-${p(m+1)}-16`,to:`${y}-${p(m+1)}-${p(last)}`};
}

const sumTitleDate = to => new Date(to+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}).toUpperCase();
async function downloadSummaryXlsx(o){
  await loadXlsx();
  const rows=o.rows, H=['No.','Request By','Type House','Block','N','BOQ','CLAIMED','BALANCE','THIS CLAIM',(rows.length?'Retention':'Retention'),'REQUEST','SUBCON.','SCOPE OF WORK','REMARK'];
  const aoa=[[`SUMMARY LABOR CLAIM - ${o.title}`],[`PROJECT: ${PROJECT_NAME}`],[`ON ${sumTitleDate(o.to)}`],H];
  rows.forEach((r,i)=>aoa.push([i+1,r.requestBy,r.houseType,r.block,r.houseNo,r.boq,r.claimed,null,r.thisClaim,r.ret,null,r.subcon,r.scope,r.remark]));
  const first=5, last=4+rows.length;
  aoa.push(['TOTAL CLAIM',null,null,null,null,null,null,null,null,null,null]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let r=first;r<=last;r++){ ws['H'+r]={t:'n',f:`F${r}-G${r}`}; ws['K'+r]={t:'n',f:`I${r}-J${r}`}; }
  const tr=last+1; ['I','J','K'].forEach(col=>ws[col+tr]={t:'n',f:`SUBTOTAL(9,${col}${first}:${col}${last})`});
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:13}},{s:{r:1,c:0},e:{r:1,c:13}},{s:{r:2,c:0},e:{r:2,c:13}},{s:{r:tr-1,c:0},e:{r:tr-1,c:7}}];
  ws['!cols']=[6,18,26,9,10,11,11,11,12,10,12,18,30,34].map(w=>({wch:w}));
  Object.keys(ws).forEach(k=>{ if(/^[F-K]\d+$/.test(k) && ws[k].t==='n') ws[k].z='#,##0.00'; });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'SUMMARY');
  const bySub={}; rows.forEach(r=>{ bySub[r.subcon]=(bySub[r.subcon]||0)+r.request; });
  const ps=XLSX.utils.aoa_to_sheet([['Sub-contractor','Sum of REQUEST'],...Object.entries(bySub).sort((a,b)=>natCmp(a[0],b[0])).map(([k,v])=>[k,r2(v)]),['Grand Total',r2(rows.reduce((t,r)=>t+r.request,0))]]);
  ps['!cols']=[{wch:28},{wch:16}]; XLSX.utils.book_append_sheet(wb,ps,'By sub-contractor');

  XLSX.writeFile(wb,`SUMMARY_${yymmdd}(${PROJECT_NAME.replace(/[\\/:*?"<>|]+/g,'')} ${o.title.replace(/[\\/:*?"<>|]+/g,'')}).xlsx`);
  toast('Excel downloaded');
}

function formModal(title,body,okLabel,onSubmit,wide){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<form class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>

    <div class="row"><button type="button" class="btn mNo">Cancel</button><button type="submit" class="btn pri mOk">${esc(okLabel)}</button></div></form>`;
  document.body.appendChild(bg);
  const f=bg.querySelector('form'), err=bg.querySelector('.mErr'), ok=bg.querySelector('.mOk');
  const first=f.querySelector('input:not([type=checkbox]):not([disabled]),select,textarea'); if(first) first.focus();
  const close=()=>bg.remove();
  bg.querySelector('.mNo').onclick=close;
  bg.onkeydown=e=>{ if(e.key==='Escape') close(); };
  f.onsubmit=async e=>{
    e.preventDefault(); ok.disabled=true; err.hidden=true;
    try{ const msg=await onSubmit(bg); if(msg){ err.textContent=msg; err.hidden=false; ok.disabled=false; return; } close(); }
    catch(ex){ err.textContent=ex.message; err.hidden=false; ok.disabled=false; }
  };
  return bg;
}

        <td class="r pv">${money(R.prev)}</td><td class="r pv">${pct(R.pp)}</td><td class="r cu">${money(R.curr)}</td><td class="r cu">${pct(R.cp)}</td><td class="r">${money(R.cum)}</td><td class="r">${pct(R.cumP)}</td><td>${R.it.transferTo?'ផ្ទេរទៅ / To: '+esc(R.it.transferTo)+' ':''}${esc(cl.remarks[R.it.id]||'')}</td></tr>`}).join('')}`}).join('')}
    ${[['[ I ]','សរុបទឹកប្រាក់ស្នើសុំទូទាត់ / TOTAL INTERIM PAYMENT CLAIM',T],['[ II ]',`ទឹកប្រាក់រក្សាទុក / RETENTION ( [ II ] = [ I ] x ${((+c.retention||0)*100).toFixed(0)}% )`,T.ret],['[ III ]','ទឹកប្រាក់ត្រូវទទួលបាន / RECEIVED AMOUNT ( [ III ] = [ I ] - [ II ] )',T.net]]
      .map(([a,b,o])=>`<tr class="tot"><td class="c">${a}</td><td colspan="4">${b}</td><td class="r">${money(o.amt)}</td><td class="r pv">${money(o.prev)}</td><td class="r pv">${pct(P(o.prev))}</td><td class="r cu">${money(o.curr)}</td><td class="r cu">${pct(P(o.curr))}</td><td class="r">${money(o.cum)}</td><td class="r">${pct(P(o.cum))}</td><td></td></tr>`).join('')}
   </tbody></table>
   <div class="sig">
     <div>ធ្វើបញ្ជីដោយ / Prepared by<div class="ln"></div>លោក ${esc(cl.preparedBy||'')}<br>វិស្វករការដ្ឋាន / Site Engineer<br>ថ្ងៃទី ........ / ........ / ${yr}</div>
     <div>ត្រួតពិនិត្យដោយ / Checked by<div class="ln"></div>លោក ${esc(cl.siteManager||'')}<br>ប្រធានការដ្ឋាន / Site Manager<br>ថ្ងៃទី ........ / ........ / ${yr}</div>
     <div>យល់ព្រមដោយ / Agreed by<div class="ln"></div>លោក ${esc(c.contractor||'')}<br>អ្នកម៉ៅការ / Sub-contractor<br>ថ្ងៃទី ........ / ........ / ${yr}</div>
   </div></div>`;
  const ph=cl.photos||[]; const pages=[];
  for(let i=0;i<ph.length;i+=6){
    pages.push(`<div class="pg">${hd}<div class="p-title">រូបភាពនៃការងារស្នើសុំទូទាត់ / PHOTO PROGRESSIVE WORK</div>
      <div class="p-info"><div><span>អ្នកម៉ៅការ ៖</span><b>${esc(c.contractor)}</b></div><div><span>កាលបរិច្ឆេទ ៖</span><b>${fmtDate(cl.date)}</b></div>
      <div><span>ទីតាំងការងារ ៖</span><b>${esc(c.location)}</b></div><div><span>លេខ IPC ៖</span><b>${esc(cl.ipcNo)}</b></div></div>
      <div class="pp">${ph.slice(i,i+6).map((p,j)=>`<figure><div class="im"><img src="${esc(p.src)}" alt=""></div><figcaption><b>${i+j+1}</b>${esc(p.caption||'')}</figcaption></figure>`).join('')}</div></div>`);
  }
  $('#print').innerHTML=page1+pages.join('');
  const imgs=[...$('#print').querySelectorAll('img')];
  Promise.all(imgs.map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;}))).then(()=>window.print());
}

/* ---------- boot ---------- */
async function boot(){
  $('#app').innerHTML='<div class="empty" style="padding:60px">Loading…</div>';
  try{
    if(!apiUrl()){
      await demoInit(); DB.users=LS.get(KEY.users,[]);
      if(SESSION){ const u=DB.users.find(x=>x.id===SESSION.user.id && x.active!==false); if(!u) setSession(null); else SESSION.user={id:u.id,username:u.username,name:u.name,role:u.role}; }
    }
    if(!SESSION) return renderLogin();
    await enterApp();
  }catch(e){
    if(e.message==='Signed out') return;
    console.error(e);
    $('#app').innerHTML=`<div class="login"><div class="lcard"><h2>Can't reach Google Sheets</h2><div class="note bad" style="margin:0">${esc(e.message)}</div><div class="muted" style="font-size:13px">Check the Web App URL, or clear it to use Demo mode.</div><button class="btn" id="bSet">Connection settings</button></div></div>`;
    $('#bSet').onclick=openSettings;
  }
}
try{ if(PROJECT_NAME) document.title=PROJECT_NAME+' · IPC Payment Claims'; }catch(e){}
window.addEventListener('beforeunload',e=>{ if(UI.dirty){ e.preventDefault(); e.returnValue=''; } });
boot();
</script>
