<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>បូរី — ប្រព័ន្ធគ្រប់គ្រងគម្រោងលំនៅឋាន</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#F1F3EF; --paper:#FFFFFF; --ink:#16211E; --muted:#5F6B66; --line:#D9DED9;
  --green:#0F6E56; --green-soft:#DCEFE7; --amber:#C4780F; --amber-soft:#FBEBCF;
  --red:#B4322E; --red-soft:#F7DAD8; --blue:#245E9E; --blue-soft:#DCE8F6;
  --r:8px; --r-sm:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Kantumruy Pro",system-ui,sans-serif;background:var(--stone);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-weight:600;line-height:1.3}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--ink);color:#E6EBE8;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-size:26px;font-weight:700;color:#fff;letter-spacing:.5px;margin-bottom:4px}
.brand small{display:block;font-size:12px;font-weight:400;color:#9DB0A8;letter-spacing:0}
.proj{font-size:13px;color:#9DB0A8;margin-bottom:18px;border-bottom:1px solid #2C3A36;padding-bottom:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;padding:9px 12px;border-radius:var(--r-sm);color:#C8D3CE;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:#243430;color:#fff}
.nav button.on{background:var(--green);color:#fff}
.nav .n{font-size:12px;background:rgba(255,255,255,.14);padding:0 7px;border-radius:10px}
.side .foot{margin-top:auto;font-size:12px;color:#7F9089}
.side .foot button{color:#C8D3CE;text-decoration:underline;padding:0}
/* main */
.main{padding:26px 30px 90px;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head p{color:var(--muted);font-size:13px}
.btn{padding:8px 14px;border-radius:var(--r-sm);background:var(--paper);border:1px solid var(--line);font-weight:500}
.btn:hover{border-color:#B9C1BB}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.pri:hover{background:#0B5A46}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.modal .kpis{grid-template-columns:repeat(3,1fr)}
.kpi b{display:block;font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--amber)}.kpi.bad b{color:var(--red)}.kpi.good b{color:var(--green)}
/* unit map */
.map{display:flex;flex-direction:column;gap:14px}
.block h3{margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.block h3 span{font-weight:400;color:var(--muted);font-size:13px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:56px;height:46px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;font-weight:500;border:1px solid transparent;transition:transform .08s}
.tile small{font-size:10px;opacity:.75}
.tile:hover{transform:translateY(-2px);border-color:var(--ink)}
.s0{background:#E3E7E3;color:#5F6B66}
.s1{background:var(--amber-soft);color:#7A4A05}
.s2{background:var(--green-soft);color:#0B5A46}
.s3{background:var(--green);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #EEF1EE;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F9F6}
.tag{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.s0{background:#E3E7E3;color:#5F6B66}.tag.s1,.tag.warn{background:var(--amber-soft);color:#7A4A05}
.tag.s2,.tag.good{background:var(--green-soft);color:#0B5A46}.tag.s3{background:var(--green);color:#fff}
.tag.bad{background:var(--red-soft);color:#8A1F1B}.tag.info{background:var(--blue-soft);color:#1B4A80}
.bar{height:8px;background:#E3E7E3;border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.a i{background:var(--amber)}
.pct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);width:40px;display:inline-block;text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
/* forms / modal */
.overlay{position:fixed;inset:0;background:rgba(22,33,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.overlay.open{display:flex}
.modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:22px}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:12px}}
.modal h2{margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#FAFBFA}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.actions .r{display:flex;gap:8px}
.stage{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF1EE}
.stage:last-child{border-bottom:0}
.stage input[type=range]{width:100%;accent-color:var(--green)}
.stage b{font-weight:500}
.work{padding:10px 0;border-bottom:1px solid #EEF1EE}.work:last-child{border-bottom:0}
.wt{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.wt b{font-weight:500}
.wb{display:flex;gap:6px}
.code{font-family:ui-monospace,Menlo,monospace;background:#EEF1EE;padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
.syncnote{background:var(--blue-soft);color:#1B4A80;padding:6px 10px;border-radius:6px;margin-bottom:10px}
.wr{display:grid;grid-template-columns:1fr 44px auto;gap:10px;align-items:center}.wr input[type=range]{width:100%;accent-color:var(--green)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.unithead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.unithead .tag{font-size:13px}
.mini{font-size:13px;color:var(--muted)}
.tabbar{display:none}
.ro .btn.pri,.ro .btn.danger,.ro .ed{display:none!important}
.ro input[type=range]{pointer-events:none;opacity:.55}
.ro .modal input,.ro .modal select,.ro .modal textarea{pointer-events:none;background:#F1F3EF}
.ro .login .btn.pri,.ro .login input,.ro .login select{display:block;pointer-events:auto;background:#FAFBFA}
.ro .click{cursor:default}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* mobile */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px 90px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:10}
  .tabbar button{flex:1;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
  .tabbar button.on{color:var(--green);font-weight:600}
  .tabbar button em{font-style:normal;font-size:18px;line-height:1}
  .f2{grid-template-columns:1fr}
  .stage{grid-template-columns:110px 1fr 40px}
  table{font-size:13px}.hide-m{display:none}
  .tile{width:50px;height:42px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">បូរី<small>ប្រព័ន្ធគ្រប់គ្រងគម្រោងលំនៅឋាន</small></div>
    <div class="proj" id="sideProj"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span id="syncState">ទិន្នន័យរក្សាទុកក្នុងឧបករណ៍នេះ</span> <button id="refreshBtn" onclick="reload()" style="display:none">↻ ទាញថ្មី</button><br><button onclick="exportJSON()">នាំចេញ JSON</button> · <button onclick="importJSON()">នាំចូល</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script>
/* ================= CONFIG =================
   ដាក់ URL របស់ Google Apps Script Web App នៅទីនេះ ដើម្បី sync ទៅ Google Sheets.
   ទុកទទេ = រក្សាទុកតែក្នុងឧបករណ៍ (localStorage). */
const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbzGTd0bRtFcKOSHNOjZCzjQB0zgzo4mUuvtHY8kmB97CJn8t6isXosOe6dCJnLhkJFB/exec", STORAGE_KEY: "borey_pm_v4" };

/* ================= VOCAB ================= */
const STATUS = ["មិនទាន់ចាប់ផ្តើម","កំពុងសាងសង់","រួចរាល់","បានប្រគល់"];
const STAGES = [
  ["foundation","គ្រឹះ",15],["structure","គ្រោងឆ្អឹង",25],["masonry","ជញ្ជាំង",15],
  ["roof","ដំបូល",10],["mep","ទឹក-ភ្លើង",10],["finish","តុបតែង/លាបថ្នាំ",20],["handover","ត្រួតពិនិត្យ/ប្រគល់",5]
];
const TYPES = ["វីឡាប្រណិត A (8×12m)","វីឡាប្រណិត A+ (8×12m)","វីឡាប្រណិត B (8×12m)","វីឡាប្រណិត B+ (8×12m)","Emperor Villa (11×26m)"];
const PRIO = ["ទាប","មធ្យម","ខ្ពស់"];
const ISTATUS = ["បើក","កំពុងដោះស្រាយ","បានបិទ"];
const PSTATUS = ["រង់ចាំ","បានអនុម័ត","បានទូទាត់"];
const WEATHER = ["ថ្ងៃស្រឡះ","មានពពក","ភ្លៀង","ភ្លៀងខ្លាំង"];
const PAGES = [
  ["dash","ផ្ទាំងព័ត៌មាន","▦"],["units","ផ្ទះ","⌂"],["pay","ថវិកា","$"],
  ["issues","បញ្ហា","!"],["daily","របាយការណ៍ប្រចាំថ្ងៃ","☰"],["admin","គ្រប់គ្រង","★"],["settings","ការកំណត់","⚙"]
];

/* ================= STATE ================= */
const REMOTE = !!CONFIG.API_URL;
let VERSION = 0, pushT = null, pushing = false, pushAgain = false, dirty = false;
let S = load();
let page = "dash";
let ME = null; try{ ME=JSON.parse(sessionStorage.getItem("borey_user")||"null"); }catch(e){}
function canEdit(){ return ME&&ME.role==="editor"; }
function guard(){ if(canEdit()) return true; toast("អ្នកមានសិទ្ធិមើលប៉ុណ្ណោះ"); return false; }
let filt = { block:"", status:"", q:"", istatus:"", bunit:"", bstatus:"" };

function seed(){
  return {
    project:{name:"បុរី អិល វីឡា",location:"",start:"",end:"",pm:"Sithy"},
    units:[], issues:[], logs:[], payments:[], users:[{name:"admin",pin:"1234",role:"editor"}], seq:0
  };
}
function migrate(d){
  d=d||{}; d.project=d.project||seed().project; d.units=d.units||[]; d.issues=d.issues||[]; d.logs=d.logs||[]; d.payments=d.payments||[]; d.seq=d.seq||0;
  if(!d.users||!d.users.length) d.users=REMOTE?[]:[{name:"admin",pin:"1234",role:"editor"}];
  d.folderId=d.folderId||""; d.lastPull=d.lastPull||""; d.project.appUrl=d.project.appUrl||""; d.units.forEach(u=>{ if(!u.works){ u.works=STAGES.map(st=>({id:++d.seq,name:st[1],weight:st[2],contractor:u.contractor||"",budget:0,pct:(u.stages||{})[st[0]]||0})); delete u.stages; delete u.contractor; delete u.budget; } });
  return d;
}
function load(){ let d=null; try{const r=localStorage.getItem(CONFIG.STORAGE_KEY); if(r) d=JSON.parse(r);}catch(e){} return d?migrate(d):seed(); }
function save(){ try{localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(S));}catch(e){}
  if(REMOTE&&canEdit()){ dirty=true; syncState("កំពុងរក្សាទុក…"); clearTimeout(pushT); pushT=setTimeout(pushRemote,800); } }
function api(req){
  const url=CONFIG.API_URL;
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url))
    return Promise.reject(new Error("API_URL មិនត្រឹមត្រូវ — ត្រូវបញ្ចប់ដោយ /exec (មិនមែន /dev)"));
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(req)})
    .then(async r=>{ const t=await r.text();
      try{ return JSON.parse(t); }
      catch(x){ throw new Error(t.indexOf("<!DOCTYPE")===0||t.indexOf("<html")>=0
        ? "Apps Script ត្រឡប់ទំព័រ HTML — ដាក់ Deploy ជា \"Anyone\" ហើយ New version"
        : "ចម្លើយមិនត្រឹមត្រូវ: "+t.slice(0,120)); } })
    .catch(e=>{ console.error("[បូរី] API",url,e); throw e instanceof Error?e:new Error(String(e)); });
}
function apiErr(e){ const m=String(e&&e.message||e);
  return /Failed to fetch|NetworkError|Load failed/i.test(m)
    ? (location.protocol==="file:"
        ? "បើកពី file:// មិនអាចភ្ជាប់បានទេ — ដាក់លើ GitHub Pages សិន"
        : "ភ្ជាប់មិនបាន — ពិនិត្យ Deploy (Anyone) និងអ៊ីនធឺណិត")
    : m; }
function syncState(t){ const e=$("syncState"); if(e) e.textContent=t; }
function storeMe(){ try{sessionStorage.setItem("borey_user",JSON.stringify(ME));}catch(e){} }
function cacheLocal(){ try{localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(S));}catch(e){} }
async function pushRemote(){
  if(!REMOTE||!ME) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    const r=await api({action:"save",name:ME.name,pin:ME.pin,version:VERSION,data:S});
    if(r.ok){ VERSION=r.version; dirty=false; const me=S.users.find(u=>u.name===ME.name); const oldRole=ME.role; if(me){ME.pin=me.pin;ME.role=me.role;storeMe();} syncState("បានរក្សាទុកក្នុង Google Sheets"); if(oldRole!==ME.role) render(); }
    else if(r.error==="stale"){ pushAgain=false; toast("មានអ្នកផ្សេងកែប្រែមុន — បានទាញទិន្នន័យថ្មី សូមកែម្តងទៀត"); dirty=false; await reload(true); }
    else if(r.error==="auth"){ toast("PIN បានផ្លាស់ប្តូរ — សូមចូលម្តងទៀត"); logout(); }
    else { syncState("រក្សាទុកបរាជ័យ"); toast("រក្សាទុកបរាជ័យ: "+r.error); }
  }catch(e){ syncState("គ្មានអ៊ីនធឺណិត — នឹងព្យាយាមម្តងទៀត"); toast(apiErr(e)); }
  pushing=false; if(pushAgain){ pushAgain=false; pushRemote(); }
}
async function saveFolder(){
  if(!guard()||!REMOTE) return;
  const r=await api({action:"setFolder",name:ME.name,pin:ME.pin,folderId:$("fid").value.trim()});
  if(!r.ok) return toast("កំហុស: "+r.error);
  S.folderId=r.folderId; cacheLocal(); toast("បានរក្សាទុក folder");
}
async function doPull(full){
  if(!guard()||!REMOTE) return;
  if(dirty) await pushRemote();
  const el=$("pullLog"); const show=t=>{ if(el) el.innerHTML=t; };
  show("កំពុងទាញ…"); syncState("កំពុងទាញពីឯកសារផ្ទះ…");
  let houses=0, scopes=0, skipped=[], removed=[], guardN=0;
  try{
    while(true){
      const r=await api({action:"pull",name:ME.name,pin:ME.pin,full:!!full&&guardN===0});
      if(!r.ok){ show(""); return toast("ទាញបរាជ័យ: "+r.error); }
      const p=r.report; houses+=p.houses; scopes+=p.scopes;
      skipped=skipped.concat(p.skipped||[]); removed=removed.concat(p.removed||[]);
      VERSION=r.version;
      if(!r.done){ show(`កំពុងទាញ… ${p.to}/${p.total} ឯកសារ · ${houses} ផ្ទះ`); if(++guardN>200) break; continue; }
      S=migrate(r.data); cacheLocal(); dirty=false; render();
      const log=$("pullLog");
      if(log) log.innerHTML=`បានទាញ <b>${houses}</b> ផ្ទះ · <b>${scopes}</b> ការងារ ពី <b>${p.total}</b> ឯកសារ ក្នុង folder "${esc(p.folder)}" (${esc(p.at)})`
        +(removed.length?`<br>បានដក ${removed.length} ផ្ទះ (ឯកសារលែងមានក្នុង folder): ${removed.map(esc).join(", ")}`:"")
        +(skipped.length?`<br><span style="color:var(--amber)">រំលង ${skipped.length}: ${skipped.map(esc).join("; ")}</span>`:"");
      syncState("ទាញរួចរាល់"); toast(`បានទាញ ${houses} ផ្ទះ`);

}
async function reload(silent){

    S=migrate(r.data); VERSION=r.version; ME.role=r.user.role; storeMe(); cacheLocal(); dirty=false;
    syncState("ធ្វើបច្ចុប្បន្នភាព "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));

function nid(){ return ++S.seq; }

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD=d=>d?d.split("-").reverse().join("/"):"—";
const money=n=>"$"+Number(n||0).toLocaleString("en-US");
const today=()=>new Date().toISOString().slice(0,10);
function newWorks(){ return STAGES.map(s=>({id:nid(),name:s[1],weight:s[2],contractor:"",budget:0,pct:0})); }
function progress(u){ const W=u.works||[]; const tw=W.reduce((a,w)=>a+Number(w.weight||0),0); if(!tw) return 0; return Math.round(W.reduce((a,w)=>a+Number(w.pct||0)*Number(w.weight||0),0)/tw); }
function budget(u){ return (u.works||[]).reduce((a,w)=>a+Number(w.budget||0),0); }
function contractors(u){ return [...new Set((u.works||[]).map(w=>w.contractor).filter(Boolean))]; }
function statusIdx(u){ if(u.handedOver) return 3; const p=progress(u); return p>=100?2:p>0?1:0; }
function appBase(){ return location.origin+location.pathname.replace(/[^/]*$/,""); }
function houseApp(u){
  if(u.appUrl) return String(u.appUrl).trim();                       // per-house override
  const t=String((S.project||{}).appUrl||"").trim();
  if(t) return t.replace(/\{house\}/gi,encodeURIComponent(u.id)).replace(/\{file\}/gi,encodeURIComponent(u.file||""));
  // default: <house>.html beside this page, e.g. .../lvilla1/E12.html
  if(location.protocol==="http:"||location.protocol==="https:") return appBase()+encodeURIComponent(u.id)+".html";
  return "";
}
function openExt(url){ if(!url) return; window.open(url,"_blank","noopener"); }
function isSync(u){ return (typeof u==="string"?(S.units.find(x=>x.id===u)||{}):u).src==="sync"; }
function used(id,wid){ const u=S.units.find(x=>x.id===id);
  if(u&&u.src==="sync") return wid==null ? u.works.reduce((a,w)=>a+Number(w.used||0),0) : Number((u.works.find(w=>w.id==wid)||{}).used||0);
  return S.payments.filter(p=>p.unit===id&&(wid==null||p.work==wid)&&p.status==="បានទូទាត់").reduce((a,p)=>a+Number(p.amount||0),0); }
function remain(u){ return budget(u)-used(u.id); }
function workName(uid,wid){ const u=S.units.find(x=>x.id===uid); const w=u&&u.works.find(w=>w.id==wid); return w?w.name:""; }
function workOpts(uid,sel){ const u=S.units.find(x=>x.id===uid); return `<option value="">— ទូទៅ —</option>`+(u?u.works.map(w=>`<option value="${w.id}" ${w.id==sel?"selected":""}>${esc(w.name)}</option>`).join(""):""); }
function blocks(){ return [...new Set(S.units.map(u=>u.block))].sort(); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function opts(arr,sel){ return arr.map(v=>`<option ${v===sel?"selected":""}>${esc(v)}</option>`).join(""); }
function unitOpts(sel){ return `<option value="">— ទូទៅ —</option>`+S.units.map(u=>`<option ${u.id===sel?"selected":""}>${u.id}</option>`).join(""); }

    ${REMOTE&&location.protocol==="file:"?`<p class="mini" style="background:var(--amber-soft);color:#7A4A05;padding:8px 10px;border-radius:6px;margin-bottom:12px">ឯកសារនេះបើកពី file:// — Google Sheets មិនអាចភ្ជាប់បានទេ។ ត្រូវដាក់លើ GitHub Pages ឬ web server សិន។</p>`:""}
    <div class="f"><label>អ្នកប្រើប្រាស់</label>${REMOTE?`<input id="lg_user" autocomplete="username">`:`<select id="lg_user">${S.users.map(u=>`<option value="${esc(u.name)}">${esc(u.name)} — ${u.role==="editor"?"គ្រប់គ្រង":"មើល"}</option>`).join("")}</select>`}</div>

function pTag(p){ return `<span class="tag ${p.status==="បានទូទាត់"?"good":p.status==="បានអនុម័ត"?"info":"warn"}">${p.status}</span>`; }
function pay(){
  const L=S.payments.filter(p=>(!filt.bunit||p.unit===filt.bunit)&&(!filt.bstatus||p.status===filt.bstatus)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const sum=st=>S.payments.filter(p=>p.status===st).reduce((a,p)=>a+Number(p.amount||0),0);

}
function saveProject(){ if(!guard()) return; S.project={name:$("p_name").value.trim(),location:$("p_loc").value.trim(),start:$("p_start").value,end:$("p_end").value,pm:$("p_pm").value.trim(),appUrl:$("p_app").value.trim()}; save(); render(); toast("បានរក្សាទុក"); }
function resetAll(){ if(!guard()) return; if(confirm("លុបទិន្នន័យទាំងអស់ ហើយចាប់ផ្តើមថ្មី?")){const us=S.users; S=seed(); S.users=us; save(); render();toast("បានចាប់ផ្តើមថ្មី");} }

/* ================= EXPORT / IMPORT ================= */
function dl(name,content,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); }
function exportJSON(){ dl(`borey_${today()}.json`,JSON.stringify(S,null,2),"application/json"); }
function exportCSV(){ const rows=[["លេខផ្ទះ","ប្លុក","ប្រភេទ","ការងារ","អ្នកម៉ៅការរង","ទម្ងន់","វឌ្ឍនភាពការងារ","ថវិកា","បានប្រើ","នៅសល់","វឌ្ឍនភាពផ្ទះ","ស្ថានភាពផ្ទះ"]];
  S.units.forEach(u=>u.works.forEach(w=>rows.push([u.id,u.block,u.type,w.name,w.contractor,w.weight,w.pct||0,w.budget||0,used(u.id,w.id),Number(w.budget||0)-used(u.id,w.id),progress(u),STATUS[statusIdx(u)]])));
  dl(`borey_works_${today()}.csv`,"\uFEFF"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8"); }
function importJSON(){ if(!guard()) return; $("fileIn").onchange=e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.units) throw 0; S=d; save(); render(); toast("បាននាំចូល");}catch{toast("ឯកសារមិនត្រឹមត្រូវ")}}; r.readAsText(f); e.target.value="";}; $("fileIn").click(); }

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(REMOTE){
  $("refreshBtn").style.display="inline";
  setInterval(()=>{ if(!ME) return; if(dirty) return pushRemote(); if(!pushing&&!$("overlay").classList.contains("open")) reload(true); },60000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ME&&!dirty&&!pushing) reload(true); });
}
render();
if(REMOTE&&ME&&ME.pin) reload(true); else if(REMOTE&&ME){ ME=null; render(); }
</script>
